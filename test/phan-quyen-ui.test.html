const ket = [];
const check = (ten, dieuKien, chiTiet = '') => ket.push({ ten, ok: !!dieuKien, chiTiet: String(chiTiet) });

try {
/* ---------- Trích hàm từ index.html ---------- */
const src = await (await fetch('../index.html')).text();
function trichHam(ten) {
  // Ham o cap ngoai cung -> ket thuc o dong "}" sat le trai. Giu ca chu "async " phia truoc.
  let i = src.indexOf('function ' + ten + '(');
  if (i < 0) throw new Error('khong tim thay ham ' + ten + ' trong index.html');
  if (src.slice(i - 6, i) === 'async ') i -= 6;
  const het = src.indexOf(String.fromCharCode(10) + '}', i);
  if (het < 0) throw new Error('khong thay cuoi ham ' + ten);
  return src.slice(i, het + 2);
}
const nguon = ['chuSoHuuMoi', 'migrateLead', 'laLoiQuyen', 'hienManKhoa', 'initCloudSync', 'quyetDinhKhoiDong', 'khoCoNhom']
  .map(trichHam).join('\n');
// Luồng lưu THẬT (chế độ chỉ xem phải chặn ở đây, không phải ở bản giả)
const nguonLuu = ['datBanGocTheoMay', 'applyRemoteData', 'leadsToObject', 'dailyTodosToObject', 'scheduleSave', 'tinhThayDoiCucBo', 'saveToCloud']
  .map(trichHam).join('\n');

// Dựng một "app" thu nhỏ: biến trạng thái + các hàm phụ initCloudSync gọi tới đều là bản giả.
// thatLuu = true -> dùng scheduleSave/saveToCloud/applyRemoteData thật của index.html.
function taoApp({ leadsBanDau = [], thatLuu = false } = {}) {
  return new Function('leadsBanDau', `
    let cloudLoaded = false, lastSyncedRaw = null, pendingRemote = null, saveTimer = null;
    let leads = leadsBanDau.slice(); let dailyTodos = []; let planRevenue = 0, planLeads = 0;
    let banGoc = { leads: {}, dailyTodos: null, planRevenue: undefined, planLeads: undefined };
    const chuSoHuuChuaLuu = new Set(); const trangThai = []; const goi = { zalo: 0, ai: 0, luu: 0 };
    function setSyncStatus(s){ trangThai.push(s); }
    function renderAll(){} function uiIsBusy(){ return false; } function doiSoatDeXuat(){}
    function initZalo(){ goi.zalo++; } function initAI(){ goi.ai++; }
    function nowLabel(){ return '01/10/2026 10:00'; }
    ${thatLuu ? nguonLuu : `
      function datBanGocTheoMay(){} function applyRemoteData(){}
      function scheduleSave(){ goi.luu++; } async function saveToCloud(){ goi.luu++; }`}
    ${nguon}
    return { chuSoHuuMoi, migrateLead, initCloudSync, quyetDinhKhoiDong, chuSoHuuChuaLuu, trangThai, goi,
             ${thatLuu ? 'saveToCloud, scheduleSave,' : ''}
             get cloudLoaded(){ return cloudLoaded; }, get saveTimer(){ return saveTimer; } };
  `)(leadsBanDau);
}
// window.__firebase giả có spy cho mọi lệnh ghi
function fbGia(duLieu, kho) {
  const ghi = [];
  return {
    ghi,
    khoUid: () => (kho && kho.uid) || OWNER,
    kho: () => kho || null,
    userDataRef: () => 'REF',
    get: async () => ({ exists: () => duLieu != null, val: () => duLieu }),
    onValue: () => () => {},
    set: (...a) => { ghi.push(['set', a]); return Promise.resolve(); },
    update: (...a) => { ghi.push(['update', a]); return Promise.resolve(); },
  };
}
const cho = ms => new Promise(r => setTimeout(r, ms));

/* ---------- 1. Admin đang ở kho Trân: lead mới + lead cũ gắn chủ = Trân (Review Focus 1) ---------- */
{

}

{

  // Tick chỉ Zalo -> lỗi, không ghi
  $('qtNguoiXem').value = 'B'; $('qtChuKho').value = OWNER;
  $('qtCrm').checked = false; $('qtZalo').checked = true; $('qtAi').checked = false;
  body.querySelector('[data-qt="gan"]').click();
  await cho(30);
  const loiZalo = PhanQuyen.chuanHoaQuyenXem({ zalo: true }).loi;
  check('tick chi Zalo: hien loi', !tb().hidden && tb().textContent === loiZalo, tb().textContent);
  check('tick chi Zalo: khong goi update', ghiQT.length === 0, JSON.stringify(ghiQT));

  // Tick CRM + AI -> ghi đúng đường dẫn, tenChuKho, rồi tải lại dữ liệu
  const docTruoc = soLanDoc;
  $('qtCrm').checked = true; $('qtZalo').checked = false; $('qtAi').checked = true;
  body.querySelector('[data-qt="gan"]').click();
  await cho(30);
  check('gan quyen: update quyenXem/<xem>/<chu>', ghiQT.length === 1 && ghiQT[0][0] === 'quyenXem/B/' + OWNER, JSON.stringify(ghiQT));
  check('gan quyen: gia tri + tenChuKho', ghiQT[0] && JSON.stringify(ghiQT[0][1]) === JSON.stringify({ crm: true, zalo: false, ai: true, tenChuKho: 'Trân' }), ghiQT[0] && JSON.stringify(ghiQT[0][1]));
  check('gan quyen xong: tai lai du lieu + bao thanh cong', soLanDoc > docTruoc && /Đã gán quyền xem/.test(tb().textContent), tb().textContent);

  // Thu hồi
  ghiQT.length = 0;
  body.querySelector('[data-qt="thuHoi"][data-xem="B"]').click();
  await cho(30);
  check('thu hoi: update quyenXem/<xem> { [chu]: null }', ghiQT.length === 1 && ghiQT[0][0] === 'quyenXem/B' && ghiQT[0][1][OWNER] === null && Object.keys(ghiQT[0][1]).length === 1, JSON.stringify(ghiQT));

  // Bật/tắt Có kho
  ghiQT.length = 0;
  const oCoKho = body.querySelector('tr[data-uid="B"] [data-qt="coKho"]');
  oCoKho.checked = true;
  oCoKho.dispatchEvent(new Event('change', { bubbles: true }));
  await cho(30);
  check('doi Co kho: update taiKhoan/<uid> { coKho }', ghiQT.length === 1 && ghiQT[0][0] === 'taiKhoan/B' && ghiQT[0][1].coKho === true, JSON.stringify(ghiQT));

  // Tạo tài khoản: mật khẩu ngắn -> lỗi, không gọi API
  $('qtEmail').value = 'moi@x.vn'; $('qtTen').value = 'Người mới'; $('qtMatKhau').value = 'abc';
  body.querySelector('[data-qt="tao"]').click();
  await cho(30);
  check('mat khau < 8: hien loi, khong goi API', goiFetch.length === 0 && /ít nhất 8 ký tự/.test(tb().textContent), tb().textContent);

  // goiApiAdmin trả { loi } -> hiện đúng loi, đã escape
  const loiDocHai = '<img src=x onerror=alert(2)>Email này đã có tài khoản.';
  traFetch = () => new Response(JSON.stringify({ loi: loiDocHai }), { status: 409, headers: { 'Content-Type': 'application/json' } });
  $('qtMatKhau').value = 'matkhau123';
  body.querySelector('[data-qt="tao"]').click();
  await cho(30);
  check('API tra loi: hien dung loi', tb().textContent === loiDocHai, tb().textContent);
  check('API tra loi: khong tao the img', !tb().querySelector('img') && !body.querySelector('img'));
  check('API tra loi: nut duoc bat lai', [...body.querySelectorAll('button')].every(b => !b.disabled));
  const [url, opt] = goiFetch[0] || [];
  check('goiApiAdmin: POST /api/admin + Bearer token', url === '/api/admin' && opt.method === 'POST' && opt.headers.Authorization === 'Bearer TOKEN123', JSON.stringify(opt));
  const than = opt ? JSON.parse(opt.body) : {};
  check('tao: than dung', than.hanhDong === 'tao' && than.email === 'moi@x.vn' && than.matKhau === 'matkhau123' && than.ten === 'Người mới' && than.coKho === false, opt && opt.body);

  // Tạo thành công -> lời nhắc gửi qua Zalo
  traFetch = () => new Response(JSON.stringify({ ok: true, uid: 'C' }), { status: 200, headers: { 'Content-Type': 'application/json' } });
  body.querySelector('[data-qt="tao"]').click();
  await cho(30);
  check('tao xong: bao gui email + mat khau qua Zalo', tb().textContent === 'Đã tạo. Gửi email + mật khẩu cho người dùng qua Zalo', tb().textContent);

  // Khoá: nút bị tắt trong lúc chờ, xong thì tải lại
  goiFetch.length = 0;
  let mo;
  traFetch = () => new Promise(r => { mo = () => r(new Response(JSON.stringify({ ok: true }), { status: 200 })); });
  body.querySelector('tr[data-uid="B"] [data-qt="khoa"]').click();
  await cho(10);
  check('dang goi API: moi nut bi tat', [...body.querySelectorAll('button')].every(b => b.disabled));
  if (mo) mo();
  await cho(30);
  const thanKhoa = goiFetch[0] ? JSON.parse(goiFetch[0][1].body) : {};
  check('khoa: than { hanhDong: khoa, uid }', thanKhoa.hanhDong === 'khoa' && thanKhoa.uid === 'B', JSON.stringify(thanKhoa));
  check('khoa xong: nut bat lai', [...body.querySelectorAll('button')].every(b => !b.disabled));

  window.fetch = fetchGoc;
  khung.remove();
}
} catch (e) {
  check('khong loi khi chay test', false, e && e.stack || e);
}

window.__ketQua = ket;
</script>
</body>
