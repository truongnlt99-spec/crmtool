<!doctype html>
<meta charset="utf-8">
<title>Test giao dien theo doi link</title>
<!-- Chay bang: npm run test:link-gui-ui -->
<body>
<div id="box"></div>
<div id="vnThanhChon"></div>
<div id="venueOverlay"><h3 id="venueModalTitle"></h3><p id="venueModalSub"></p><div id="venueModalBody"></div><div id="venueModalFooter"></div></div>
<script type="module">
import * as L from '../web/link-gui.js';
import * as V from '../web/venue.js';

const ket = [];
const check = (ten, dk, ct = '') => ket.push({ ten, ok: !!dk, chiTiet: String(ct) });
// Lỗi giữa chừng thì vẫn trả kết quả để thấy nguyên nhân, không chỉ báo "không có kết quả".
window.addEventListener('error', e => { check('loi trong trang', false, e.message); window.__ketQua = ket; });
const box = document.getElementById('box');
const XSS = '<img src=x onerror="window.__bi=1">';
const chu = () => box.innerText;

/* 1. Dòng khách */
const lead = { id: 'L123', name: 'Chị Mai Anh', stage: 'baogia', weddingDate: '2026-12-14' };
box.innerHTML = L.veDongKhach(lead, 1, 2, 'Báo giá');
check('dong khach co ten + giai doan + ngay cuoi', /Chị Mai Anh/.test(chu()) && /Báo giá/.test(chu()) && /14\/12/.test(chu()), chu());
check('nhan da gui 1/2', /Đã gửi 1\/2 mẫu/.test(chu()), chu());
check('bam chon dung khach', /chonKhachGui\('L123'\)/.test(box.innerHTML), box.innerHTML);
check('dong khach la button', box.querySelector('button.lg-khach'));
box.innerHTML = L.veDongKhach(lead, 0, 2, 'Báo giá');
check('chua gui thi khong co nhan', !/Đã gửi/.test(chu()));
box.innerHTML = L.veDongKhach({ id: 'L1', name: XSS, stage: 'x' }, 0, 1, XSS);
check('dong khach chong XSS', !box.querySelector('img') && !window.__bi, box.innerHTML);
box.innerHTML = L.veDongKhach({ id: "L1'),alert(1)//", name: 'A', stage: 'x' }, 0, 1, '');
check('id la khong thanh onclick', !/onclick/.test(box.innerHTML), box.innerHTML);

/* 2. Dòng link */
const URL_T = 'https://huyentran.vercel.app/xem/abcDEF1234';
box.innerHTML = L.veDongLink({ tenSp: 'Pre Wedding', url: URL_T, daCo: false, soLanMo: 0 }, 0);
check('dong link co nut copy mang url', box.querySelector('[data-url]')?.dataset.url === URL_T, box.innerHTML);
check('link moi khong co ghi chu', !/trước đó/.test(chu()));
box.innerHTML = L.veDongLink({ tenSp: 'A', url: URL_T, daCo: true, soLanMo: 3 }, 0);
check('link cu hien so lan mo', /Link đã gửi trước đó · khách mở 3 lần/.test(chu()), chu());
box.innerHTML = L.veDongLink({ tenSp: 'A', url: URL_T, daCo: true, soLanMo: 0 }, 0);
check('link cu chua mo', /Link đã gửi trước đó · khách chưa mở/.test(chu()), chu());
box.innerHTML = L.veDongLink({ tenSp: 'A', dangTao: true }, 0);
check('dang tao', /Đang tạo/.test(chu()) && !box.querySelector('[data-url]'), chu());
box.innerHTML = L.veDongLink({ tenSp: 'A', loi: 'Sản phẩm không còn tồn tại' }, 2);
check('loi co thu lai dung dong', /Sản phẩm không còn tồn tại/.test(chu()) && /thuLaiLink\(2\)/.test(box.innerHTML), box.innerHTML);
box.innerHTML = L.veDongLink({ tenSp: XSS, url: `${URL_T}"><img src=x>`, loi: '' }, 0);
check('dong link chong XSS', !box.querySelector('img'), box.innerHTML);
box.innerHTML = L.veDongLink({ tenSp: 'A', loi: XSS }, 0);
check('loi chong XSS', !box.querySelector('img'), box.innerHTML);

/* 2b. Khối trong lead + danh sách chọn mẫu */
const MOC = new Date(2026, 9, 30, 21, 40).getTime();
box.innerHTML = L.veKhoiDaGui([
  { token: 'a', tenSp: 'Pre Wedding', soLanMo: 4, lanCuoi: MOC, nhan: 'quanTam' },
  { token: 'b', tenSp: 'Mẫu đã xoá khỏi kho', nhan: 'chuaMo', taoLuc: MOC },
]);
check('khoi: so lan mo + gan nhat', /4 lần mở/.test(chu()) && /21:40 30\/10/.test(chu()), chu());
check('khoi: hien nhan', /Quan tâm/.test(chu()) && /Chưa mở/.test(chu()), chu());
check('khoi: san pham da xoa van hien ten', /Mẫu đã xoá khỏi kho/.test(chu()));
box.innerHTML = L.veKhoiDaGui([]);
check('khoi rong', /Chưa gửi sản phẩm nào/.test(chu()));
box.innerHTML = L.veKhoiDaGui([{ token: 'x', tenSp: XSS, nhan: 'chuaMo' }]);
check('khoi chong XSS', !box.querySelector('img'), box.innerHTML);

const MAU = [
  { venue: { id: 'v1', ten: 'A' }, sp: { id: 's1', ten: 'M1', link: 'https://a' } },
  { venue: { id: 'v2', ten: 'B' }, sp: { id: 's2', ten: 'M2', link: 'https://b' } },
];
check('dua mau dung venue len dau', L.uuTienVenue(MAU, 'v2')[0].sp.id === 's2');
check('khong co venue giu nguyen', L.uuTienVenue(MAU, null)[0].sp.id === 's1');
box.innerHTML = L.veDongMau(MAU[0], true);
check('dong mau co tick', box.querySelector('input').checked && box.querySelector('input').dataset.sp === 'v1/s1');
box.innerHTML = L.veDongMau({ venue: { id: 'v1', ten: XSS }, sp: { id: 's1', ten: XSS, link: 'https://a' } }, false);
check('dong mau chong XSS', !box.querySelector('img'));
box.innerHTML = L.veDongMau({ venue: { id: 'v1', ten: 'A' }, sp: { id: 's1', ten: 'A', link: 'javascript:1' } }, false);
check('link hong khong chon duoc', !box.querySelector('input'));
box.innerHTML = '';

/* 2c. Bảng Lần gửi */
const DS_GUI = L.dsLanGui({
  a: { leadId: 'L1', tenSp: XSS, guiLuc: MOC, soLanGui: 2, soLanMo: 3, lanCuoi: MOC },
  b: { leadId: 'L9', tenSp: 'Mẫu Hai', guiLuc: MOC - 86400000, soLanGui: 1 },
}, id => ({ L1: 'Chị Mai Anh' })[id] || '');
box.innerHTML = L.veLanGui(DS_GUI, DS_GUI, { khoa: 'guiLuc', giam: true, origin: 'https://x' });
check('lan gui: du dong', box.querySelectorAll('tbody tr').length === 2);
check('lan gui: tong ket', /2 link/.test(chu()) && /3 lần gửi/.test(chu()) && /1 đã mở/.test(chu()) && /3 lượt click/.test(chu()), chu());
check('lan gui: co ngay, so lan, trang thai', /30\/10\/2026/.test(chu()) && /Quan tâm/.test(chu()) && /Chưa mở/.test(chu()), chu());
check('lan gui: bam khach mo lead', /openLead\('L1'\)/.test(box.innerHTML));
check('lan gui: lead da xoa khong bam duoc', /\(lead đã xoá\)/.test(chu()) && !/openLead\('L9'\)/.test(box.innerHTML), chu());
check('lan gui: copy dung link', box.querySelector('[data-url]').dataset.url === 'https://x/xem/a', box.querySelector('[data-url]')?.dataset.url);
check('lan gui: cot dang sap xep co aria-sort', box.querySelector('th[aria-sort="descending"]')?.textContent.includes('Ngày gửi'));
check('lan gui: bam tieu de de sap xep', /doiSapLanGui\('soLanMo'\)/.test(box.innerHTML));
check('lan gui chong XSS', !box.querySelector('img'), box.innerHTML.slice(0, 300));
box.innerHTML = L.veLanGui([], DS_GUI, { khoa: 'guiLuc', giam: true, origin: 'https://x' });
check('lan gui: loc rong co nut xoa loc', /Không có lần gửi nào khớp/.test(chu()) && /xoaLocLanGui/.test(box.innerHTML), chu());
box.innerHTML = L.veLanGui([], [], { khoa: 'guiLuc', giam: true, origin: 'https://x' });
check('lan gui: chua gui gi', /Chưa gửi link/.test(chu()), chu());
box.innerHTML = '';

/* 3. Cả luồng tạo link: chạy nguyên văn hàm trong index.html */
const src = await (await fetch('../index.html')).text();
const giua = (dau, cuoi) => { const a = src.indexOf(dau), b = src.indexOf(cuoi, a); if (a < 0 || b < 0) throw new Error('khong tim thay ' + dau); return src.slice(a, b); };
const ham = ten => { const a = src.indexOf(`function ${ten}(`); return src.slice(a, src.indexOf('\n}', a) + 2); };
const NL = String.fromCharCode(10);
check('thanh chon dinh ca khoi de dinh duoc cuoi bang', /#vnThanhChon\{position:sticky; bottom:0;/.test(src));
window.LinkGui = L;
window.esc = s => String(s ?? '').replace(/[&<>"']/g, k => `&#${k.charCodeAt(0)};`);
window.STAGES = [{ id: 'baogia', name: 'Báo giá' }, { id: 'leadin', name: 'Lead in' }];
window.leads = [
  { id: 'L1', name: 'Chị Mai Anh', phone: '0901', stage: 'baogia', createdAt: '2026-10-01', weddingDate: '2026-12-14' },
  { id: 'L2', name: 'Anh Hoàng', phone: '', stage: 'leadin', createdAt: '2026-10-05' },
  { id: 'L3', name: 'Đã chốt', stage: 'won', createdAt: '2026-10-09' },
];
window.venues = { v1: { id: 'v1', ten: 'V', sanPham: { s1: { id: 's1', ten: 'Mẫu Một' }, s2: { id: 's2', ten: 'Mẫu Hai' } } } };
window.venueGoiYDangMo = null;
window.renderVenue = () => { window.__soLanVe = (window.__soLanVe || 0) + 1; };
window.uiIsBusy = () => false;
window.__firebase = { auth: { currentUser: { getIdToken: async () => 'tok' } }, khoUid: () => 'uidKho' };
const nap = document.createElement('script');
nap.textContent = [giua('async function goiApiAdmin(', '// Đọc toàn bộ taiKhoan'), giua('function copyChuoi(', 'function moVenueModal('), ham('moVenueModal'), ham('dongVenueModal')].join(NL);
document.head.append(nap);

const dem = { goi: [], clip: [] };
let chanClipboard = false;
Object.defineProperty(navigator, 'clipboard', { value: {
  writeText: async s => { dem.clip.push(s); },
  write: async ds => { const b = await ds[0].getType('text/plain'); if (chanClipboard) throw new Error('chan'); dem.clip.push(await b.text()); },
}, configurable: true });
let traLoi;
window.fetch = async (u, o) => { dem.goi.push({ u, body: JSON.parse(o.body), auth: o.headers.Authorization }); return traLoi(JSON.parse(o.body)); };
const json = (d, status = 200) => new Response(JSON.stringify(d), { status });
const cho = () => new Promise(r => setTimeout(r, 30));
const $ = id => document.getElementById(id);
const CHUA_DOI = id => $(id).textContent;

linkGuiDat({ a: { leadId: 'L1', venueId: 'v1', spId: 's1' } });
function linkGuiDat(d){ window.eval(`linkGuiData = ${JSON.stringify(d)}`); }

moChonKhach(['v1/s1', 'v1/s2']);
check('mo hop chon khach', CHUA_DOI('venueModalTitle') === 'Gửi cho khách nào?' && /2 sản phẩm/.test(CHUA_DOI('venueModalSub')));
check('o tim duoc focus', document.activeElement === $('lgTim'));
const dsTen = () => $('lgDsKhach').innerText;
check('bo khach da won khi chua go', /Mai Anh/.test(dsTen()) && /Anh Hoàng/.test(dsTen()) && !/Đã chốt/.test(dsTen()), dsTen());
check('nhan da gui 1/2', /Đã gửi 1\/2 mẫu/.test(dsTen()), dsTen());
check('khach vua gui len dau', /^\s*Vừa gửi/.test(dsTen()) && document.querySelector('#lgDsKhach button').textContent.includes('Mai Anh'), dsTen());
check('khach vua gui khong lap lai', dsTen().match(/Mai Anh/g).length === 1, dsTen());
check('nhan nhom khach moi nhat', /Khách mới nhất/.test(dsTen()), dsTen());
$('lgTim').value = 'khong co'; veDsKhach();
check('khong thay khach', /Không tìm thấy khách "khong co"/.test(dsTen()) && /có trong CRM/.test(dsTen()), dsTen());
$('lgTim').value = 'mai'; veDsKhach();

traLoi = b => json({ ok: true, ketQua: [
  { token: 't1', url: 'https://x/xem/t1', tenSp: 'Mẫu Một', venueId: 'v1', spId: 's1', daCo: true, soLanMo: 3 },
  { venueId: 'v1', spId: 's2', loi: 'Sản phẩm không còn tồn tại' },
] });
$('lgTim').dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
check('Enter chon khach dau tien', CHUA_DOI('venueModalTitle') === 'Link cho Chị Mai Anh', CHUA_DOI('venueModalTitle'));
check('dang tao ca 2 dong', ($('venueModalBody').textContent.match(/Đang tạo/g) || []).length === 2);
await cho();
const g0 = dem.goi[0];
check('goi dung API, kho, khach', g0.u === '/api/link-gui' && g0.body.khoUid === 'uidKho' && g0.body.leadId === 'L1' && g0.body.dsSp.length === 2 && g0.auth === 'Bearer tok', JSON.stringify(g0));
check('dong tot + dong loi', /khách mở 3 lần/.test($('venueModalBody').textContent) && /không còn tồn tại/.test($('venueModalBody').textContent));
document.querySelector('[data-url]').click();
await cho();
check('copy mot link', dem.clip.at(-1) === 'https://x/xem/t1', dem.clip);
const nutTatCa = $('venueModalFooter').querySelector('.btn-primary');
nutTatCa.click();
await cho();
check('copy tat ca bo dong loi', dem.clip.at(-1) === 'https://x/xem/t1', dem.clip.at(-1));

traLoi = () => json({ ok: true, ketQua: [{ token: 't2', url: 'https://x/xem/t2', tenSp: 'Mẫu Hai', venueId: 'v1', spId: 's2', daCo: false, soLanMo: 0 }] });
thuLaiLink(1);
await cho();
check('thu lai chi gui dong loi', dem.goi.at(-1).body.dsSp.length === 1 && dem.goi.at(-1).body.dsSp[0].spId === 's2');
check('thu lai xong co link', document.querySelectorAll('[data-url]').length === 2);

dongVenueModal();
check('dong hop', !$('venueOverlay').classList.contains('show'));

window.__loiMang = true;
traLoi = () => { throw new Error('mat mang'); };
moChonKhach(['v1/s1']);
chonKhachGui('L2');
await cho();
check('mat mang: dong co thu lai', /thuLaiLink\(0\)/.test($('venueModalBody').innerHTML), $('venueModalBody').innerHTML);
check('mat mang: nut copy tat ca tat', $('venueModalFooter').querySelector('.btn-primary').disabled);
dongVenueModal();

let xa; traLoi = () => new Promise(r => { xa = r; });
moChonKhach(['v1/s1']);
chonKhachGui('L2');
await cho();
dongVenueModal();
xa(json({ ok: true, ketQua: [{ token: 't', url: 'u', tenSp: 'x' }] }));
await cho();
check('dong hop luc dang tao: khong mo lai', !$('venueOverlay').classList.contains('show'));

window.__chiXem = true;
moChonKhach(['v1/s1']);
check('chi xem khong mo hop', !$('venueOverlay').classList.contains('show'));
moChonMauChoKhach('L1');
check('chi xem khong mo chon mau', !$('venueOverlay').classList.contains('show'));
window.__chiXem = false;

window.Venue = V;
window.venues.v2 = { id: 'v2', ten: 'Gem', sanPham: { s9: { id: 's9', ten: 'Mẫu Gem', link: 'https://b', tone: [] } } };
window.venues.v1.sanPham.s1.link = 'https://a';
window.venues.v1.sanPham.s2.link = 'https://c';
leads[0].venueId = 'v2';
moChonMauChoKhach('L1');
check('chon mau: tieu de dung khach', /Chị Mai Anh/.test(CHUA_DOI('venueModalTitle')), CHUA_DOI('venueModalTitle'));
check('chon mau: mau dung venue len dau', document.querySelector('#lgDsMau input').dataset.sp === 'v2/s9');
check('chon mau: chua chon thi nut tat', $('lgNutTaoLink').disabled);
$('lgTimMau').value = 'mẫu một'; veDsMau();
check('chon mau: tim duoc', document.querySelectorAll('#lgDsMau input').length === 1, $('lgDsMau').innerText);
document.querySelector('#lgDsMau input').click();
$('lgTimMau').value = ''; veDsMau();
check('chon mau: giu tick khi doi tu khoa', document.querySelectorAll('#lgDsMau input:checked').length === 1);
check('chon mau: chon xong nut bat', !$('lgNutTaoLink').disabled);
traLoi = () => json({ ok: true, ketQua: [{ token: 't', url: 'https://x/xem/t', tenSp: 'Mẫu Một', venueId: 'v1', spId: 's1', daCo: false, soLanMo: 0 }] });
$('lgNutTaoLink').click();
await cho();
check('chon mau: tao link dung khach', dem.goi.at(-1).body.leadId === 'L1' && dem.goi.at(-1).body.dsSp[0].spId === 's1', JSON.stringify(dem.goi.at(-1)));
check('chon mau: tu copy, dong hop', dem.clip.at(-1) === 'https://x/xem/t' && !$('venueOverlay').classList.contains('show'), dem.clip.at(-1));

/* 4. Tự copy khi tạo xong */
const mot = (spId, ten, them = {}) => ({ token: 't' + spId, url: `https://x/xem/${spId}`, tenSp: ten, venueId: 'v1', spId, daCo: false, soLanMo: 0, ...them });
traLoi = () => json({ ok: true, ketQua: [mot('s1', 'Mẫu Một')] });
moChonKhach(['v1/s1']);
chonKhachGui('L2');
await cho();
check('mot mau: chon khach la xong', dem.clip.at(-1) === 'https://x/xem/s1' && !$('venueOverlay').classList.contains('show'), dem.clip.at(-1));
check('mot mau: bao da copy', /Đã copy link cho Anh Hoàng/.test($('lgToast').textContent), $('lgToast').textContent);
check('thong bao doc duoc bang trinh doc man hinh', $('lgToast').getAttribute('role') === 'status');

traLoi = () => json({ ok: true, ketQua: [mot('s1', 'Mẫu Một', { daCo: true, soLanMo: 3 })] });
moChonKhach(['v1/s1']);
chonKhachGui('L1');
await cho();
check('link cu: bao so lan khach mo', /Khách đã mở 3 lần/.test($('lgToast').textContent), $('lgToast').textContent);

traLoi = () => json({ ok: true, ketQua: [mot('s1', 'Mẫu Một'), mot('s2', 'Mẫu Hai')] });
moChonKhach(['v1/s1', 'v1/s2']);
chonKhachGui('L2');
await cho();
check('nhieu mau: copy ca ten va link', dem.clip.at(-1) === 'Mẫu Một\nhttps://x/xem/s1\n\nMẫu Hai\nhttps://x/xem/s2', dem.clip.at(-1));
check('nhieu mau: bao so link', /Đã copy 2 link/.test($('lgToast').textContent), $('lgToast').textContent);

chanClipboard = true;
traLoi = () => json({ ok: true, ketQua: [mot('s1', 'Mẫu Một')] });
moChonKhach(['v1/s1']);
chonKhachGui('L2');
await cho();
check('khong copy duoc: giu hop de copy tay', $('venueOverlay').classList.contains('show') && !!document.querySelector('[data-url]'));
chanClipboard = false;
dongVenueModal();

window.eval(`venueChon.add('v1/s1'); venueChon.add('v1/s2');`);
moChonKhach(['v1/s9']);
chonKhachGui('L2');
await cho();
check('gui mot dong khong mat o dang tick', window.eval('venueChon.size') === 2);
moChonKhach(['v1/s1', 'v1/s2']);
chonKhachGui('L2');
await cho();
check('gui nhom dang tick thi bo tick', window.eval('venueChon.size') === 0);
dongVenueModal();
window.__soLanVe = 0;
moChonKhach(['v1/s1']);
chonKhachGui('L2');
await cho();
check('dong hop thi ve lai bang', window.__soLanVe >= 1);

/* 5. Màn Thống kê */
const tenKhach = id => ({ L1: 'Chị Mai Anh' })[id] || '';
const LINK = {
  a: { leadId: 'L1', venueId: 'v1', spId: 's1', tenSp: XSS, soLanMo: 4, lanCuoi: MOC, guiLuc: 1 },
  b: { leadId: 'L9', venueId: 'v1', spId: 's2', tenSp: 'Mẫu Hai', soLanMo: 1, lanCuoi: MOC - 1, guiLuc: 2 },
  c: { leadId: 'L1', venueId: 'v1', spId: 's3', tenSp: 'Mẫu Ba', guiLuc: 3 },
};
const NGAY = { '2026-10-30': { mo: 4 }, '2026-10-31': { mo: 1 } };
box.innerHTML = L.veThongKe({ linkGui: LINK, linkGuiNgay: NGAY, homNay: '2026-10-31', tenKhach });
const o = [...box.querySelectorAll('.lg-o')].map(x => x.innerText.replace(/\s+/g, ' '));
check('4 o so', o.length === 4 && /Sản phẩm đã gửi\s*3/.test(o[0]) && /Khách đã nhận\s*2/.test(o[1]) && /Lượt click\s*5/.test(o[2]) && /Tỉ lệ mở\s*67%/.test(o[3]), o.join(' | '));
check('bieu do du 14 cot', box.querySelectorAll('.lg-cot').length === 14);
check('cot co nhan cho trinh doc man hinh', box.querySelectorAll('.lg-cot')[12].getAttribute('aria-label') === '30/10: 4 lượt click');
check('chi ghi so tren cot cao nhat', box.querySelectorAll('.lg-cot b').length === 1 && box.querySelector('.lg-cot b').textContent === '4');
check('bam khach mo lead', /openLead\('L1'\)/.test(box.innerHTML));
check('lead da xoa khong bam duoc', /\(lead đã xoá\)/.test(chu()) && !/openLead\('L9'\)/.test(box.innerHTML), chu());
check('thong ke chong XSS', !box.querySelector('img'), box.innerHTML.slice(0, 300));
box.innerHTML = L.veThongKe({ linkGui: LINK, linkGuiNgay: {}, homNay: '2026-10-31', tenKhach });
check('chua co click trong ky thi khong ve cot', !box.querySelector('.lg-cot') && /Chưa có lượt click/.test(chu()), chu());
box.innerHTML = L.veThongKe({ linkGui: {}, linkGuiNgay: {}, homNay: '2026-10-31', tenKhach });
check('chua gui gi: moi di gui', /Chưa gửi link/.test(chu()) && /doiTabVenue\('sp'\)/.test(box.innerHTML));
box.innerHTML = L.veThongKe({ linkGui: {}, linkGuiNgay: {}, homNay: '2026-10-31', tenKhach, chiXem: true });
check('chi xem: khong moi di gui', !/doiTabVenue/.test(box.innerHTML));
box.innerHTML = '';

window.__ketQua = ket;
</script>
</body>
