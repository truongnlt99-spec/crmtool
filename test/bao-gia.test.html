<!doctype html>
<meta charset="utf-8">
<title>Test khoi Bao gia</title>
<!-- Chay bang: npm run test:bao-gia-ui -->
<body>
<div id="box"></div>
<script type="module">
import * as B from '../web/bao-gia.js';

const ket = [];
const check = (ten, dk, ct = '') => ket.push({ ten, ok: !!dk, chiTiet: String(ct) });
const box = document.getElementById('box');
const XSS = '<img src=x onerror="window.__bi=1">';
const buoi = (o) => ({ loai: 'cuoi', ten: 'Đám cưới', ngay: '2026-12-24', gio: null, soKhach: '750', moTa: null, goi: 'Gói Standard',
  giaGoc: 29900000, uuDaiPhanTram: 5, giaSauUuDai: 28405000, ekip: ['1 Quay phim'], sanPham: ['Phim 4-6 phút'], quaTang: [], ...o });
const bg = (o) => ({ tieuDe: 'Phương án quay chụp', tenKhach: 'Cô dâu Huyền', diaDiem: 'Hà Nội',
  buoi: [buoi({ loai: 'anHoi', ten: 'Lễ ăn hỏi', ngay: '2026-11-16', goi: 'Combo 2 máy', giaGoc: 18000000, uuDaiPhanTram: 25, giaSauUuDai: 13500000 }), buoi({})],
  tongGiaGoc: 47900000, tongSauUuDai: 41905000, tietKiem: 5995000, hanUuDai: '2026-10-20', ghiChu: ['Phụ phí 3.000.000 đ/máy'], ...o });

/* 1. Chưa có báo giá */
check('chua co: rong', B.veBaoGia({}, '2026-10-15') === '');
check('chua co: moi nhat null', B.baoGiaMoiNhat({ baoGia: {} }) === null);

/* 2. Bản mới nhất + các bản cũ */
const lead = { baoGia: {
  bg_a: bg({ taoLuc: '2026-10-10T03:00:00.000Z', tongSauUuDai: 45000000 }),
  bg_b: bg({ taoLuc: '2026-10-14T03:00:00.000Z' }),
} };
check('moi nhat la bg_b', B.baoGiaMoiNhat(lead).id === 'bg_b');
box.innerHTML = B.veBaoGia(lead, '2026-10-15');
check('2 buoi', box.querySelectorAll('.bg-buoi').length === 2);
check('gia goc gach + gia sau uu dai', !!box.querySelector('.bg-buoi s') && /28\.405\.000 đ/.test(box.innerText), box.innerText.slice(0, 300));
check('phan tram uu dai', /−25%/.test(box.innerText) && /−5%/.test(box.innerText));
check('tong sau uu dai', /41\.905\.000 đ/.test(box.querySelector('.bg-tong').innerText));
check('tiet kiem', /Tiết kiệm 5\.995\.000 đ/.test(box.innerText));
check('ban cu thu gon', /1 bản báo giá trước/.test(box.querySelector('.bg-ban-cu summary').innerText) && /45\.000\.000 đ/.test(box.querySelector('.bg-ban-cu').textContent));
check('chi tiet ekip trong details', !!box.querySelector('.bg-buoi details') && /1 Quay phim/.test(box.querySelector('.bg-buoi details').textContent));
check('ghi chu', /Phụ phí 3\.000\.000 đ\/máy/.test(box.innerText));

/* 3. Hạn ưu đãi */
check('han con', B.trangThaiHan('2026-10-20', '2026-10-15') === 'con');
check('han sap (3 ngay)', B.trangThaiHan('2026-10-18', '2026-10-15') === 'sap');
check('han hom nay la sap', B.trangThaiHan('2026-10-15', '2026-10-15') === 'sap');
check('han het', B.trangThaiHan('2026-10-14', '2026-10-15') === 'het');
check('khong han', B.trangThaiHan(null, '2026-10-15') === null);
box.innerHTML = B.veBaoGia({ baoGia: { x: bg({ taoLuc: 't', hanUuDai: '2026-10-17' }) } }, '2026-10-15');
check('han sap: class + con n ngay', !!box.querySelector('.bg-han.sap') && /còn 2 ngày/.test(box.innerText), box.innerText);
box.innerHTML = B.veBaoGia({ baoGia: { x: bg({ taoLuc: 't', hanUuDai: '2026-10-10' }) } }, '2026-10-15');
check('han het: da het han', !!box.querySelector('.bg-han.het') && /đã hết hạn/.test(box.innerText));

/* 4. Dữ liệu Firebase thiếu mảng rỗng / null không làm vỡ */
box.innerHTML = B.veBaoGia({ baoGia: { x: { tieuDe: 'T', tenKhach: 'K', buoi: [{ loai: 'cuoi', ten: 'Cưới', goi: 'G', giaGoc: 1000, uuDaiPhanTram: 0, giaSauUuDai: 1000 }], tongGiaGoc: 1000, tongSauUuDai: 1000, tietKiem: 0, taoLuc: 't' } } }, '2026-10-15');
check('thieu truong khong vo', box.querySelectorAll('.bg-buoi').length === 1 && !/undefined|NaN/.test(box.innerText), box.innerText);

/* 6. Nhiều phương án */
const cuoiPA = (goi, gia) => buoi({ ten: 'Rước dâu + tiệc', ngay: '2026-11-25', goi, giaGoc: gia, uuDaiPhanTram: 0, giaSauUuDai: gia });
const NHIEU = { taoLuc: '2026-10-15T03:00:00.000Z', tieuDe: 'So sánh 2 phương án', tenKhach: 'Anh Đức Minh', diaDiem: 'Mipec', hanUuDai: null, ghiChu: [],
  buoi: [buoi({ loai: 'anHoi', ten: 'Lễ ăn hỏi', ngay: '2026-11-24', goi: 'Gói Standard 1 buổi', giaGoc: 20900000, uuDaiPhanTram: 0, giaSauUuDai: 20900000 })],
  phuongAn: [
    { ma: 'opt1', ten: 'Option 1', nhan: 'Vừa vặn', buoi: [cuoiPA('Gói Unique full ngày', 46900000)], tongGiaGoc: 67800000, tongSauUuDai: 67800000, tietKiem: 0, diemKhacBiet: 'Unique vừa vặn' },
    { ma: 'opt2', ten: 'Option 2', nhan: 'Trọn vẹn nhất', buoi: [cuoiPA('Gói Signature full ngày', 65900000)], tongGiaGoc: 86800000, tongSauUuDai: 86800000, tietKiem: 0, diemKhacBiet: XSS },
  ] };
box.innerHTML = B.veBaoGia({ baoGia: { bg_n: NHIEU } }, '2026-10-15', { choPhepChon: true });
check('buoi chung mot lan', box.querySelectorAll('.bg-chung .bg-buoi').length === 1 && /Giống nhau ở mọi phương án/.test(box.innerText));
check('2 the phuong an', box.querySelectorAll('.bg-pa').length === 2);
check('tong tung phuong an', /67\.800\.000 đ/.test(box.querySelectorAll('.bg-pa')[0].innerText) && /86\.800\.000 đ/.test(box.querySelectorAll('.bg-pa')[1].innerText));
check('nut chon tren ca 2', box.querySelectorAll('.bg-pa [onclick*="chonPhuongAn(\'bg_n\',\'opt"]').length === 2);
check('diem khac biet escape', !box.querySelector('img') && box.innerText.includes('<img src=x'));
box.innerHTML = B.veBaoGia({ baoGia: { bg_n: NHIEU } }, '2026-10-15');
check('khong choPhepChon -> khong nut', !box.querySelector('[onclick*="chonPhuongAn"]'));
/* Review Focus 5: đã chọn */
box.innerHTML = B.veBaoGia({ baoGia: { bg_n: { ...NHIEU, phuongAnDaChon: 'opt2' } } }, '2026-10-15', { choPhepChon: true });
const pas = box.querySelectorAll('.bg-pa');
check('da chon: nhan + an nut o PA da chon', pas[1].classList.contains('da-chon') && /Khách đã chọn/.test(pas[1].innerText) && !pas[1].querySelector('[onclick]'));
check('da chon: PA kia mo nhung van chon duoc', pas[0].classList.contains('mo') && !!pas[0].querySelector('[onclick*="opt1"]'));
/* Review Focus 1: buổi chung rỗng (Firebase bỏ) */
box.innerHTML = B.veBaoGia({ baoGia: { bg_n: { ...NHIEU, buoi: undefined } } }, '2026-10-15', { choPhepChon: true });
check('khong buoi chung: khong vo, khong tieu de chung', box.querySelectorAll('.bg-pa').length === 2 && !box.querySelector('.bg-chung'));
/* Bản cũ nhiều phương án */
box.innerHTML = B.veBaoGia({ baoGia: { bg_n: NHIEU, bg_moi: { ...NHIEU, taoLuc: '2026-10-16T03:00:00.000Z' } } }, '2026-10-17');
check('ban cu nhieu PA: tu tong nho nhat', /2 phương án · từ 67\.800\.000 đ/.test(box.querySelector('.bg-ban-cu').textContent), box.querySelector('.bg-ban-cu').textContent);
/* Id / ma lạ không vào onclick */
box.innerHTML = B.veBaoGia({ baoGia: { "x');window.__bi=1;('": NHIEU } }, '2026-10-15', { choPhepChon: true });
check('id la: khong nut chon', !box.querySelector('[onclick*="chonPhuongAn"]'));
/* Hàm cho nút chọn */
check('phuongAnCua + goiCuoiCua', B.phuongAnCua(NHIEU, 'opt2').tongSauUuDai === 86800000 && B.goiCuoiCua(B.phuongAnCua(NHIEU, 'opt2')) === 'Signature' && B.phuongAnCua(NHIEU, 'opt9') === null);
check('khopGoi web giong server', B.khopGoi('Gói Unique full ngày') === 'Unique' && B.khopGoi('Combo 2 máy') === null && B.khopGoi('Gói lẻ') === 'Gói lẻ' && B.khopGoi('Gói Signatureplus') === null && B.khopGoi('Gói Lễ cưới full ngày') === null);

/* 7. Chọn phương án trong app: đề xuất từ báo giá đang chờ mà lệch giá trị vừa áp -> phải bỏ */
const dsDx = [
  { id: 'f_a', leadId: 'L2', status: 'cho', type: 'field', field: 'revenueExpected', newValue: 86800000, nguon: { loai: 'baoGia', baoGiaId: 'bg_n' } },
  { id: 'f_b', leadId: 'L2', status: 'cho', type: 'field', field: 'package', newValue: 'Signature', nguon: { loai: 'baoGia', baoGiaId: 'bg_n' } },
  { id: 'f_c', leadId: 'L2', status: 'cho', type: 'field', field: 'package', newValue: 'Unique', nguon: { loai: 'baoGia', baoGiaId: 'bg_n' } },
  { id: 'f_d', leadId: 'L2', status: 'cho', type: 'field', field: 'weddingDate', newValue: '2026-11-25', nguon: { loai: 'baoGia', baoGiaId: 'bg_n' } },
  { id: 'f_e', leadId: 'L9', status: 'cho', type: 'field', field: 'package', newValue: 'Signature', nguon: { loai: 'baoGia', baoGiaId: 'bg_n' } },
  { id: 'f_f', leadId: 'L2', status: 'cho', type: 'field', field: 'package', newValue: 'Signature' },
  { id: 'f_g', leadId: 'L2', status: 'bo', type: 'field', field: 'package', newValue: 'Signature', nguon: { loai: 'baoGia', baoGiaId: 'bg_n' } },
];
check('de xuat lech sau khi chon', JSON.stringify(B.deXuatLechSauKhiChon(dsDx, { leadId: 'L2', revenueExpected: 67800000, package: 'Unique' })) === JSON.stringify(['f_a', 'f_b']),
  JSON.stringify(B.deXuatLechSauKhiChon && B.deXuatLechSauKhiChon(dsDx, { leadId: 'L2', revenueExpected: 67800000, package: 'Unique' })));

/* 5. Chống XSS */
box.innerHTML = B.veBaoGia({ baoGia: { x: bg({ taoLuc: 't', tieuDe: XSS, ghiChu: [XSS], buoi: [buoi({ goi: XSS, ekip: [XSS] })] }) } }, '2026-10-15');
check('khong tao the img', !box.querySelector('img'), box.innerHTML.slice(0, 300));
check('van hien nguyen van', box.innerText.includes('<img src=x'));
check('khong co ma nao chay', window.__bi === undefined);

window.__ketQua = ket;
</script>
</body>
