<!doctype html>
<meta charset="utf-8">
<title>Test đọc DOM Zalo</title>
<!--
  Fixture dựng theo ĐÚNG cấu trúc DOM thật của chat.zalo.me (dò ngày 2026-09-28).
  Chạy bằng: node test/zalo-dom.test.ts  (tự mở Chrome ngầm, không cần mở tay).
-->
<body>
<script type="module">
import { textFromMessage, quoteFromMessage } from '../extension/lib/dom-text.js';
import * as DT from '../extension/lib/dom-text.js';

const ket = [];
const check = (ten, dieuKien, chiTiet = '') => ket.push({ ten, ok: !!dieuKien, chiTiet: String(chiTiet) });

// Rác có trong MỌI tin: 6 emoji thả cảm xúc + giờ gửi (nằm ngoài text-message__container)
const RAC = `
  <div class="message-reaction-container message-reaction-container-v2"><div><div class="emoji-list-wrapper me">
    <div class="reaction-emoji-list">
      <div class="reaction-emoji-icon"><span class="emoji-sizer emoji-outer">❤️</span></div>
      <div class="reaction-emoji-icon"><span class="emoji-sizer emoji-outer">👍</span></div>
      <div class="reaction-emoji-icon"><span class="emoji-sizer emoji-outer">😄</span></div>
    </div></div></div></div>
  <div class="card-send-time flx"><span class="card-send-time__sendTime non-selected">08:16</span></div>`;

const tin = (ben_trong) => {
  const d = document.createElement('div');
  d.className = 'chat-message chat-message-v2';
  d.id = 'bb_msg_id_1758500000000';
  d.innerHTML = `<div class="message-wrapper message-wrapper--me"><div class="message-content-wrapper">
    <div class="message-content-render focused-background"><div class="me"><div>
      ${ben_trong}${RAC}
    </div></div></div></div></div>`;
  document.body.appendChild(d);
  return d;
};

/* ---------- 1. Tin thường: span.text ---------- */
const thuong = tin(`<div class="message-action"><div class="text-message__container"><div>
  <div class="overflow-hidden"><span-15><span class="text">tin nhắn bình thường</span></span-15></div>
</div></div></div>`);
check('tin thuong lay dung chu', textFromMessage(thuong) === 'tin nhắn bình thường', textFromMessage(thuong));

/* ---------- 2. Tin IN ĐẬM: span không có class, trong .editor-input ---------- */
const dam = tin(`<div class="message-action"><div class="text-message__container"><div>
  <div class="overflow-hidden"><span-15><div><div class="editor-input"><div>
    <span><strong>tin nhắn in đậm</strong></span>
  </div></div></div></span-15></div>
</div></div></div>`);
check('tin IN DAM lay duoc chu', textFromMessage(dam) === 'tin nhắn in đậm', textFromMessage(dam));

/* ---------- 3. Tin IN NGHIÊNG ---------- */
const nghieng = tin(`<div class="message-action"><div class="text-message__container"><div>
  <div class="overflow-hidden"><span-15><div><div class="editor-input"><div>
    <span><em>tin nhắn in nghiêng</em></span>
  </div></div></div></span-15></div>
</div></div></div>`);
check('tin IN NGHIENG lay duoc chu', textFromMessage(nghieng) === 'tin nhắn in nghiêng', textFromMessage(nghieng));

/* ---------- 4. Không dính giờ gửi và emoji thả cảm xúc ---------- */
const chu = textFromMessage(thuong) + textFromMessage(dam) + textFromMessage(nghieng);
check('khong dinh gio gui', !chu.includes('08:16'));
check('khong dinh emoji tha cam xuc', !/❤️|👍|😄/.test(chu));

/* ---------- 5. Tin nhiều dòng + emoji trong nội dung ---------- */
const nhieuDong = tin(`<div class="text-message__container"><div><div class="overflow-hidden"><span-15><div>
  <div class="editor-input"><div><span>dòng một<br>dòng hai <img alt="🎉" src="x.png"></span></div></div>
</div></span-15></div></div></div>`);
check('giu xuong dong va emoji trong noi dung', textFromMessage(nhieuDong) === 'dòng một\ndòng hai 🎉', JSON.stringify(textFromMessage(nhieuDong)));

/* ---------- 6. Tin trả lời: KHÔNG lẫn phần trích dẫn vào nội dung ---------- */
const traLoi = tin(`<div class="text-message__container"><div><div class="overflow-hidden"><span-15>
  <div class="message-quote-fragment">
    <div class="message-quote-fragment__title-wrapper"><div class="message-quote-fragment__title">Huyền Trân</div></div>
    <div class="message-quote-fragment__content-container"><div class="message-quote-fragment__description">bảng giá Signature</div></div>
  </div>
  <span class="text">dạ chị xem giúp em</span>
</span-15></div></div></div>`);
check('tin tra loi: chi lay noi dung', textFromMessage(traLoi) === 'dạ chị xem giúp em', textFromMessage(traLoi));
const q = quoteFromMessage(traLoi);
check('tin tra loi: doc duoc trich dan', q && q.title === 'Huyền Trân' && q.text === 'bảng giá Signature', JSON.stringify(q));

/* ---------- 7. Tin ảnh: không có container chữ -> null ---------- */
const anh = tin(`<div class="message-action"><div class="card"><img alt="" src="anh.jpg"></div></div>`);
check('tin anh -> null', textFromMessage(anh) === null, JSON.stringify(textFromMessage(anh)));

/* ---------- 8. Tin chưa vẽ xong -> null ---------- */
const rong = tin(`<div class="text-message__container"><div><div class="overflow-hidden"></div></div></div>`);
check('chua ve xong -> null', textFromMessage(rong) === null, JSON.stringify(textFromMessage(rong)));

/* ==================================================================
   Các loại tin kèm nội dung ngoài chữ (link xem trước, file, chú thích)
   Cấu trúc dưới đây là MẪU GIẢ: thuật toán cố ý KHÔNG dựa vào tên class,
   chỉ gom chữ nhìn thấy trong bong bóng + href, nên Zalo đổi class vẫn chạy.
   ================================================================== */
const thu = (fn) => { try { return fn(); } catch (e) { return { loi: e.message }; } };
// Phu luc doc duoc that su (khong phai loi) -> cac check 'khong duoc lan rac' moi co y nghia
const coPL = (x) => !!x && typeof x === 'object' && !x.loi;

/* ---------- 9. Trích dẫn nhiều dòng: giữ xuống dòng, không mất chữ ---------- */
const quoteNhieuDong = tin(`<div class="text-message__container"><div><span-15>
  <div class="message-quote-fragment">
    <div class="message-quote-fragment__title-wrapper"><div class="message-quote-fragment__title">Chị Phương Anh</div></div>
    <div class="message-quote-fragment__content-container"><div class="message-quote-fragment__description">
      <div class="message-quote-fragment__text">dòng một<br>dòng hai <img alt="🎉" src="x.png"></div>
    </div></div>
  </div>
  <span class="text">dạ em gửi chị</span>
</span-15></div></div>`);
const q2 = thu(() => quoteFromMessage(quoteNhieuDong));
check('trich dan nhieu dong: giu xuong dong', q2 && q2.text === 'dòng một\ndòng hai 🎉', JSON.stringify(q2));
check('trich dan nhieu dong: noi dung tin khong lan trich dan', textFromMessage(quoteNhieuDong) === 'dạ em gửi chị', textFromMessage(quoteNhieuDong));

/* ---------- 10. Tin chữ KÈM LINK xem trước (kind card) ---------- */
const kemLink = tin(`<div class="message-action">
  <div class="text-message__container"><div><div class="overflow-hidden"><span-15>
    <span class="text">Anh Đức xem thêm video tại đây ạ:</span>
  </span-15></div></div></div>
  <div class="card-link"><a href="https://youtu.be/abc123" target="_blank">
    <div class="card-link__title">Phóng sự cưới HayDay</div>
    <div class="card-link__desc">youtube.com</div>
  </a></div>
</div>`);
check('tin kem link: noi dung chu khong lan tieu de link', textFromMessage(kemLink) === 'Anh Đức xem thêm video tại đây ạ:', textFromMessage(kemLink));
check('tin kem link: lay duoc URL', thu(() => DT.linkFromMessage(kemLink)) === 'https://youtu.be/abc123', thu(() => DT.linkFromMessage(kemLink)));

/* ---------- 11. Tin CHỈ có link xem trước (kind link) ---------- */
const chiLink = tin(`<div class="message-action"><div class="card-link">
  <a href="https://hayday.vn/bang-gia"><div class="card-link__title">Bảng giá 2026</div>
  <div class="card-link__desc">hayday.vn</div></a>
</div></div>`);
const pl11 = thu(() => DT.attachmentFromMessage(chiLink));
check('tin chi co link: lay URL', pl11 && pl11.url === 'https://hayday.vn/bang-gia', JSON.stringify(pl11));
check('tin chi co link: lay tieu de lam noi dung', pl11 && pl11.text === 'Bảng giá 2026\nhayday.vn', JSON.stringify(pl11));
check('tin chi co link: ten mien KHONG bi coi la ten file', coPL(pl11) && !pl11.fileName, JSON.stringify(pl11));

/* ---------- 12. Tin FILE: lấy tên file ---------- */
const file = tin(`<div class="message-action"><div class="file-message">
  <div class="file-message__name">Bao gia HayDay 2026.pdf</div>
  <div class="file-message__size">1,2 MB</div>
</div></div>`);
const pl12 = thu(() => DT.attachmentFromMessage(file));
check('tin file: lay dung ten file', pl12 && pl12.fileName === 'Bao gia HayDay 2026.pdf', JSON.stringify(pl12));
check('tin file: noi dung co ten file va dung luong', pl12 && pl12.text === 'Bao gia HayDay 2026.pdf\n1,2 MB', JSON.stringify(pl12));
check('tin file: khong dinh gio gui / cam xuc', coPL(pl12) && !/08:16|❤️|👍|😄/.test(pl12.text || ''), JSON.stringify(pl12));

/* ---------- 13. Sticker: không có chữ -> không ghi gì ---------- */
const sticker = tin(`<div class="message-action"><div class="sticker-wrapper"><img alt="" src="sticker.png"></div></div>`);
const pl13 = thu(() => DT.attachmentFromMessage(sticker));
check('sticker: khong sinh noi dung rac', coPL(pl13) && !pl13.text && !pl13.url && !pl13.fileName, JSON.stringify(pl13));

/* ---------- 14. Ảnh có chú thích: lấy chú thích, KHÔNG lấy tên file ảnh ---------- */
const anhCoChu = tin(`<div class="message-action">
  <div class="card"><img alt="IMG_20260101_123456.jpg" src="anh.jpg"></div>
  <div class="photo-caption">Xe cưới của c đây <img alt="🎉" src="e.png"></div>
</div>`);
const pl14 = thu(() => DT.attachmentFromMessage(anhCoChu));
check('anh co chu thich: lay duoc chu thich + emoji', pl14 && pl14.text === 'Xe cưới của c đây 🎉', JSON.stringify(pl14));
check('anh co chu thich: khong lay ten file anh tu alt', coPL(pl14) && !pl14.fileName, JSON.stringify(pl14));

/* ---------- 15. Bong bóng lạ (Zalo đổi class): vẫn đọc được chữ ---------- */
const la = tin(`<div class="xyz-9f2"><div class="abc-11">Tin dạng mới của Zalo</div></div>`);
check('bong bong la: van doc duoc chu', thu(() => DT.attachmentFromMessage(la).text) === 'Tin dạng mới của Zalo', JSON.stringify(thu(() => DT.attachmentFromMessage(la))));

/* ---------- 16. Phụ lục không lấn sang phần trích dẫn ---------- */
const fileTraLoi = tin(`<div class="message-action">
  <div class="message-quote-fragment"><div class="message-quote-fragment__description">gửi em bảng giá nhé</div></div>
  <div class="file-message"><div class="file-message__name">Bang gia.xlsx</div></div>
</div>`);
const pl16 = thu(() => DT.attachmentFromMessage(fileTraLoi));
check('phu luc: khong lan chu trong trich dan', pl16 && pl16.text === 'Bang gia.xlsx', JSON.stringify(pl16));
check('phu luc: ten file trong tin tra loi', pl16 && pl16.fileName === 'Bang gia.xlsx', JSON.stringify(pl16));

/* ---------- 17. DOM that cua Zalo bi minify: cac div dinh lien, khong co khoang trang ---------- */
const fileMin = tin('<div class="message-action"><div class="f"><div class="n">Bang gia Signature.pdf</div><div class="s">980 KB</div></div></div>');
const pl17 = thu(() => DT.attachmentFromMessage(fileMin));
check('DOM minify: ten file khong dinh lien dung luong', coPL(pl17) && pl17.fileName === 'Bang gia Signature.pdf', JSON.stringify(pl17));
check('DOM minify: noi dung tach thanh 2 dong', coPL(pl17) && pl17.text === 'Bang gia Signature.pdf' + String.fromCharCode(10) + '980 KB', JSON.stringify(pl17));

/* ==================================================================
   enrichFromDom(): gắn những gì đọc được từ DOM vào tin đã có siêu dữ liệu.
   content.js chỉ gọi đúng hàm này -> lỗi "quên nối dây" bị test bắt tại đây.
   ================================================================== */
const tinGoc = (kind) => ({ msgId: '700', cliMsgId: '1758500000000', convId: '123', at: 1758500000123, fromMe: false, kind });

/* ---------- 18. Tin chữ: gắn chữ, không sinh url/fileName ---------- */
const e18 = thu(() => DT.enrichFromDom(tinGoc('text'), thuong));
check('enrich tin chu: co text', coPL(e18) && e18.text === 'tin nhắn bình thường', JSON.stringify(e18));
check('enrich tin chu: khong sinh url/fileName', coPL(e18) && !e18.url && !e18.fileName, JSON.stringify(e18));

/* ---------- 19. Tin chữ chưa vẽ xong -> null để lần quét sau thử lại ---------- */
check('enrich tin chu chua ve xong -> null', thu(() => DT.enrichFromDom(tinGoc('text'), rong)) === null, JSON.stringify(thu(() => DT.enrichFromDom(tinGoc('text'), rong))));

/* ---------- 20. Tin kèm link xem trước: giữ chữ VÀ lấy URL ---------- */
const e20 = thu(() => DT.enrichFromDom(tinGoc('card'), kemLink));
check('enrich tin kem link: giu nguyen chu', coPL(e20) && e20.text === 'Anh Đức xem thêm video tại đây ạ:', JSON.stringify(e20));
check('enrich tin kem link: co url', coPL(e20) && e20.url === 'https://youtu.be/abc123', JSON.stringify(e20));

/* ---------- 21. Tin file: có tên file ---------- */
const e21 = thu(() => DT.enrichFromDom(tinGoc('file'), file));
check('enrich tin file: co fileName', coPL(e21) && e21.fileName === 'Bao gia HayDay 2026.pdf', JSON.stringify(e21));
check('enrich tin file: text co ten file', coPL(e21) && (e21.text || '').indexOf('Bao gia HayDay 2026.pdf') === 0, JSON.stringify(e21));

/* ---------- 22. Ảnh có chú thích: lấy chú thích làm nội dung ---------- */
const e22 = thu(() => DT.enrichFromDom(tinGoc('image'), anhCoChu));
check('enrich anh co chu thich: text la chu thich', coPL(e22) && e22.text === 'Xe cưới của c đây 🎉', JSON.stringify(e22));

/* ---------- 23. Sticker: không có chữ nhưng vẫn giữ tin (không trả null) ---------- */
const e23 = thu(() => DT.enrichFromDom(tinGoc('sticker'), sticker));
check('enrich sticker: van giu tin', coPL(e23) && e23.kind === 'sticker', JSON.stringify(e23));
check('enrich sticker: khong co khoa text', coPL(e23) && !('text' in e23), JSON.stringify(e23));

/* ---------- 24. Tin trả lời: gắn kèm trích dẫn ---------- */
const e24 = thu(() => DT.enrichFromDom(tinGoc('text'), quoteNhieuDong));
check('enrich tin tra loi: co trich dan nhieu dong', coPL(e24) && e24.quote && e24.quote.text === 'dòng một\ndòng hai 🎉', JSON.stringify(e24));

/* ---------- 18. DOM THAT (do 11/10/2026): Zalo tach ten file thanh 2 manh de hien dau "..."
   Hai manh nam CUNG MOT DONG -> phai ghep lien, khong duoc xuong dong giua ten file.
   Bang chung: tin that luu duoc "HayDay-CRM-Zalo-v0 / .1.7.zip" va fileName sai thanh ".1.7.zip" ---------- */
const fileTach = tin(`<div class="message-action"><div class="file-message">
  <div style="display:flex; flex-direction:row">
    <div class="name-head">HayDay-CRM-Zalo-v0</div><div class="name-tail">.1.7.zip</div>
  </div>
  <div class="size">27.52 KB</div>
  <div class="hint">Tải về để xem lâu dài</div>
</div></div>`);
const pl18 = thu(() => DT.attachmentFromMessage(fileTach));
check('ten file bi tach 2 manh: ghep lai dung', coPL(pl18) && pl18.fileName === 'HayDay-CRM-Zalo-v0.1.7.zip', JSON.stringify(pl18));
check('ten file bi tach: khong xuong dong giua ten', coPL(pl18) && (pl18.text || '').split(String.fromCharCode(10))[0] === 'HayDay-CRM-Zalo-v0.1.7.zip', JSON.stringify(pl18 && pl18.text));
check('ten file bi tach: dung luong van o dong rieng', coPL(pl18) && (pl18.text || '').includes(String.fromCharCode(10) + '27.52 KB'), JSON.stringify(pl18 && pl18.text));

/* ---------- 19. Video gui dang file: ten cung bi tach (do 4/10/2026) ---------- */
const videoTach = tin(`<div class="message-action"><div class="file-message">
  <div class="duration">01:23</div>
  <div style="display:flex"><div>video_20261003_1638</div><div>23_1.mp4</div></div>
  <div>152.35 MB</div>
</div></div>`);
const pl19 = thu(() => DT.attachmentFromMessage(videoTach));
check('ten video bi tach: ghep lai dung', coPL(pl19) && pl19.fileName === 'video_20261003_163823_1.mp4', JSON.stringify(pl19));

/* ---------- 20. DOM THAT: the link xem truoc cua Zalo KHONG phai <a href>.
   Tin that 15:12 11/10/2026 doc duoc chu "https://... / Tour rodai... / www.youtube.com"
   nhung url trong -> phai lay URL tu chinh phan chu nhin thay. ---------- */
const theLink = tin(`<div class="message-action"><div class="card-web" role="button">
  <div class="card-web__link">https://www.youtube.com/watch?v=1_OLIAIyc5E</div>
  <div class="card-web__title">Tour rodai 500km Sài Gòn - Nha Trang bằng Cfmoto 450mt mới sắm.</div>
  <div class="card-web__domain">www.youtube.com</div>
</div></div>`);
const pl20 = thu(() => DT.attachmentFromMessage(theLink));
check('the link khong phai <a>: van lay duoc URL tu chu', coPL(pl20) && pl20.url === 'https://www.youtube.com/watch?v=1_OLIAIyc5E', JSON.stringify(pl20));
check('the link: giu ca tieu de lam noi dung', coPL(pl20) && (pl20.text || '').includes('Tour rodai 500km'), JSON.stringify(pl20 && pl20.text));

/* ---------- 21. <a href> van duoc uu tien hon URL trong chu ---------- */
const uuTien = tin(`<div class="message-action">
  <div class="text-message__container"><div><span class="text">xem ở trang chủ hayday.vn nhé</span></div></div>
  <div class="card"><a href="https://hayday.vn/bang-gia-2026">Bảng giá 2026</a></div>
</div>`);
check('uu tien href that hon chu', thu(() => DT.linkFromMessage(uuTien)) === 'https://hayday.vn/bang-gia-2026', thu(() => DT.linkFromMessage(uuTien)));

/* ---------- 22. Chu binh thuong co dau cham KHONG bi nham la URL ---------- */
const khongPhaiLink = tin(`<div class="message-action"><div class="file-message">
  <div>Bao gia.pdf</div><div>1,2 MB</div></div></div>`);
const pl22 = thu(() => DT.attachmentFromMessage(khongPhaiLink));
check('ten file khong bi nham thanh URL', coPL(pl22) && !pl22.url, JSON.stringify(pl22));

/* ---------- 23. DOM THAT tin 15:11 ngay 11/10/2026 (anh chup man hinh):
   chu + URL mau xanh + the xem truoc (anh nho, tieu de, kenh, ten mien).
   Truoc khi sua: luu duoc moi "test gui tin nhan kem link", url trong. ---------- */
const tinThat = tin(`<div class="message-action">
  <div class="text-message__container"><div><div class="overflow-hidden"><span-15>
    <span class="text">test gửi tin nhắn kèm link</span>
  </span-15></div></div></div>
  <div class="link-text">https://www.youtube.com/watch?v=1_OLIAIyc5E</div>
  <div class="card-web" role="button">
    <div class="card-web__thumb"><img alt="" src="thumb.jpg"></div>
    <div class="card-web__title">Tour rodai 500km Sài Gòn - Nha Trang bằng Cfmoto…</div>
    <div class="card-web__source">Bụi Đời 2 Bánh</div>
    <div class="card-web__domain">www.youtube.com</div>
  </div>
</div>`);
const e30 = thu(() => DT.enrichFromDom({ msgId: '1', cliMsgId: '1', convId: '1', at: 1, fromMe: true, kind: 'card' }, tinThat));
check('tin that 15:11: lay duoc URL', coPL(e30) && e30.url === 'https://www.youtube.com/watch?v=1_OLIAIyc5E', JSON.stringify(e30));
check('tin that 15:11: chu dung y nhu ngoai that', coPL(e30) && e30.text === 'test gửi tin nhắn kèm link', JSON.stringify(e30 && e30.text));
check('tin that 15:11: khong nham tieu de thanh ten file', coPL(e30) && !e30.fileName, JSON.stringify(e30));

window.__ketQua = ket;
</script>
</body>
