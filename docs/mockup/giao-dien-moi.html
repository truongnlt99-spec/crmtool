<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HayDay CRM — Đề xuất giao diện mới</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --rose:#1F8F6A; --rose-grad:linear-gradient(135deg,#3DB386 0%,#21946C 50%,#0F6B50 100%); --rose-grad-soft:linear-gradient(135deg,#E6F5EE 0%,#DAF0E5 100%); --rose-ink:#0F6B50; --rose-hover:#18805F; --rose-soft:#E3F3EC; --rose-50:#F2FAF6; --rose-line:#BFE3D3;
  --bg:#FBF8F6; --surface:#fff; --well:#F4EEEB; --border:#ECE3DF; --border-soft:#F4EEEB;
  --ink:#201B1E; --ink-2:#61565B; --ink-3:#8F8288;
  --green:#0F6B50; --green-soft:#E3F3EC; --amber:#9A6514; --amber-soft:#FBF0DC; --red:#B4233F; --red-soft:#FDE8EB;
  --slate:#4F6A80; --slate-soft:#EAF0F5; --violet:#6E58A0; --violet-soft:#F0ECF8;
  --r-sm:8px; --r:12px; --r-lg:16px;
  --sh:0 1px 2px rgba(32,27,30,.05); --sh-pop:0 18px 48px rgba(32,27,30,.16);
}
*{box-sizing:border-box}
body{margin:0; font-family:'Be Vietnam Pro',system-ui,sans-serif; color:var(--ink); background:#E8EEEA; font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased}
button{font:inherit; color:inherit; cursor:pointer}
.num{font-variant-numeric:tabular-nums}

/* ---------- Khung trang đề xuất ---------- */
.mk-head{position:sticky; top:0; z-index:20; background:rgba(251,248,246,.92); backdrop-filter:blur(10px); border-bottom:1px solid var(--border)}
.mk-in{max-width:1320px; margin:0 auto; padding:14px 24px; display:flex; align-items:center; gap:18px; flex-wrap:wrap}
.mk-title{font-weight:700; font-size:15px; display:flex; align-items:center; gap:10px}
.mk-title small{font-weight:500; color:var(--ink-3); font-size:12.5px}
.mk-tabs{display:flex; gap:4px; flex-wrap:wrap; margin-left:auto}
.mk-tabs a{text-decoration:none; color:var(--ink-2); font-size:13px; font-weight:500; padding:6px 12px; border-radius:999px}
.mk-tabs a:hover{background:var(--well)}
.mk-tabs a.on{background:var(--rose-grad); color:#fff; box-shadow:0 4px 12px -4px rgba(31,143,106,.55)}
.mk-body{max-width:1320px; margin:0 auto; padding:24px}
.view{display:none} .view.on{display:block}
.note{max-width:860px; color:var(--ink-2); font-size:14px; margin:0 0 16px}
.note b{color:var(--ink)}
.scroller{overflow-x:auto; border-radius:20px; box-shadow:0 30px 80px -30px rgba(20,60,45,.35), 0 0 0 1px rgba(32,27,30,.06)}

/* ---------- App ---------- */
.app{min-width:1240px; height:800px; display:grid; grid-template-columns:228px 1fr; background:var(--bg); border-radius:20px; overflow:hidden}
.side{background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; padding:16px 12px}
.brand{display:flex; align-items:center; gap:10px; padding:2px 6px 14px}
.logo{width:34px; height:34px; border-radius:10px; background:var(--rose-grad-soft); display:grid; place-items:center}
.brand b{display:block; font-size:14px}
.kho{display:flex; align-items:center; gap:4px; font-size:12px; color:var(--ink-3); background:none; border:0; padding:0}
.nav{display:flex; flex-direction:column; gap:2px; margin-top:6px}
.nav-l{font-size:11px; font-weight:600; color:var(--ink-3); text-transform:uppercase; letter-spacing:.06em; padding:14px 10px 6px}
.ni{display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:9px; color:var(--ink-2); font-weight:500; font-size:13.5px; border:0; background:none; text-align:left; width:100%}
.ni svg{width:18px; height:18px; flex:none; color:var(--ink-3)}
.ni:hover{background:var(--bg)}
.ni.on{background:var(--rose-grad-soft); color:var(--rose-ink); font-weight:600}
.ni.on svg{color:var(--rose)}
.ni .bd{margin-left:auto; font-size:11px; font-weight:700; min-width:20px; text-align:center; padding:1px 6px; border-radius:999px; background:var(--well); color:var(--ink-2)}
.ni .bd.hot{background:var(--rose-grad); color:#fff}
.side-foot{margin-top:auto; display:flex; align-items:center; gap:10px; padding:10px 8px 2px; border-top:1px solid var(--border-soft)}
.side-foot .who{font-size:13px; font-weight:600; line-height:1.2}
.side-foot .who small{display:block; font-weight:400; color:var(--ink-3); font-size:11.5px}
.side-foot .ic-btn{margin-left:auto}

.main{display:flex; flex-direction:column; min-width:0; min-height:0}
.top{height:64px; flex:none; display:flex; align-items:center; gap:12px; padding:0 24px; border-bottom:1px solid var(--border); background:var(--surface)}
.top h1{font-size:18px; margin:0; font-weight:700; letter-spacing:-.01em}
.top .sub{color:var(--ink-3); font-size:13px}
.search{margin-left:auto; display:flex; align-items:center; gap:8px; width:300px; height:36px; padding:0 10px; border:1px solid var(--border); border-radius:10px; color:var(--ink-3); font-size:13px; background:var(--bg)}
.search svg{width:16px; height:16px}
.kbd{margin-left:auto; font-size:11px; border:1px solid var(--border); border-radius:5px; padding:0 5px; background:#fff}
.btn{display:inline-flex; align-items:center; gap:6px; height:36px; padding:0 14px; border-radius:10px; border:1px solid var(--border); background:var(--surface); font-weight:600; font-size:13px; white-space:nowrap}
.btn svg{width:16px; height:16px}
.btn.pri{background:var(--rose-grad); border-color:transparent; color:#fff; box-shadow:0 4px 12px -4px rgba(31,143,106,.55)}
.btn.pri:hover{filter:brightness(.95)}
.btn.sm{height:30px; padding:0 10px; font-size:12.5px; border-radius:8px}
.btn.ghost{border-color:transparent; background:none; color:var(--ink-2)}
.btn.won{background:var(--rose-grad); border-color:transparent; color:#fff; box-shadow:0 4px 12px -4px rgba(31,143,106,.55)}
.ic-btn{width:32px; height:32px; display:grid; place-items:center; border-radius:8px; border:0; background:none; color:var(--ink-3)}
.ic-btn svg{width:18px; height:18px}
.content{flex:1; min-height:0; overflow:hidden; padding:20px 24px}

.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); box-shadow:var(--sh)}
.card-h{display:flex; align-items:center; gap:8px; padding:14px 16px 10px}
.card-h h3{margin:0; font-size:14px; font-weight:700}
.card-h .more{margin-left:auto; font-size:12.5px; color:var(--rose-ink); font-weight:600}
.muted{color:var(--ink-3)}
.av{width:32px; height:32px; flex:none; border-radius:50%; display:grid; place-items:center; font-size:12px; font-weight:700; background:var(--rose-soft); color:var(--rose-ink)}
.av.b{background:var(--slate-soft); color:var(--slate)} .av.c{background:var(--amber-soft); color:var(--amber)} .av.d{background:var(--violet-soft); color:var(--violet)} .av.e{background:var(--green-soft); color:var(--green)}
.av.lg{width:44px; height:44px; font-size:15px}
.pill{display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600; padding:2px 8px; border-radius:999px; white-space:nowrap; background:var(--well); color:var(--ink-2)}
.pill svg{width:13px; height:13px}
.pill.red{background:var(--red-soft); color:var(--red)} .pill.amber{background:var(--amber-soft); color:var(--amber)}
.pill.green{background:var(--green-soft); color:var(--green)} .pill.rose{background:var(--rose-soft); color:var(--rose-ink)}
.pill.slate{background:var(--slate-soft); color:var(--slate)} .pill.violet{background:var(--violet-soft); color:var(--violet)}
.dot{width:7px; height:7px; border-radius:50%; background:currentColor; flex:none}
.bar{height:6px; border-radius:99px; background:var(--well); overflow:hidden}
.bar i{display:block; height:100%; background:var(--rose-grad); border-radius:99px}
.ph{display:inline-block; height:8px; border-radius:4px; background:var(--well)}

/* ---------- Hôm nay ---------- */
.today{display:grid; grid-template-columns:1fr 360px; gap:20px; height:100%}
.hello{display:flex; align-items:flex-end; gap:16px; margin-bottom:16px}
.hello h2{margin:0; font-size:22px; letter-spacing:-.01em}
.hello p{margin:2px 0 0; color:var(--ink-2)}
.stats{display:grid; grid-template-columns:1.5fr 1fr 1fr 1fr; gap:12px; margin-bottom:16px}
.stat{padding:14px 16px}
.stat .l{font-size:12px; color:var(--ink-3); font-weight:500}
.stat .v{font-size:22px; font-weight:700; letter-spacing:-.02em; margin:2px 0 8px}
.stat .v small{font-size:13px; font-weight:500; color:var(--ink-3); letter-spacing:0}
.stat .d{font-size:12px; color:var(--ink-2)}
.up{color:var(--green); font-weight:600}
.todo-g{padding:2px 0 6px}
.todo-g h4{margin:0; padding:10px 16px 6px; font-size:12px; font-weight:600; color:var(--ink-3); display:flex; align-items:center; gap:6px}
.row{display:flex; align-items:center; gap:12px; padding:9px 16px; border-top:1px solid var(--border-soft)}
.row:hover{background:var(--rose-50)}
.row .t{min-width:0; flex:1}
.row .t b{font-weight:600; font-size:13.5px}
.row .t div{font-size:12.5px; color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.row .amt{font-size:13px; font-weight:600; width:70px; text-align:right}
.prop{padding:12px 16px; border-top:1px solid var(--border-soft)}
.prop .who{display:flex; align-items:center; gap:8px; font-size:13px}
.prop .chg{margin:8px 0 10px; font-size:13px; background:var(--bg); border-radius:8px; padding:8px 10px}
.prop .chg s{color:var(--ink-3)} .prop .chg b{color:var(--rose-ink)}
.prop .acts{display:flex; gap:6px}
.link-row{display:flex; align-items:center; gap:10px; padding:9px 16px; border-top:1px solid var(--border-soft); font-size:13px}
.link-row .t{flex:1; min-width:0}
.link-row .t div{font-size:12px; color:var(--ink-3)}

/* ---------- Pipeline ---------- */
.lead-tools{display:flex; align-items:center; gap:8px; margin-bottom:14px}
.seg{display:inline-flex; padding:3px; gap:2px; background:var(--well); border-radius:10px}
.seg button{white-space:nowrap; border:0; background:none; padding:5px 12px; border-radius:8px; font-size:13px; font-weight:500; color:var(--ink-2); display:flex; align-items:center; gap:6px}
.seg button svg{width:15px; height:15px}
.seg button.on{background:#fff; color:var(--ink); font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chip{white-space:nowrap; display:inline-flex; align-items:center; gap:6px; height:32px; padding:0 12px; border-radius:999px; border:1px solid var(--border); background:#fff; font-size:13px; color:var(--ink-2); font-weight:500}
.chip svg{width:14px; height:14px}
.chip.on{background:var(--rose-soft); border-color:var(--rose-line); color:var(--rose-ink); font-weight:600}
.board{display:flex; gap:14px; height:calc(100% - 46px); margin-right:-24px}
.col{width:268px; flex:none; display:flex; flex-direction:column; min-height:0}
.col-h{display:flex; align-items:baseline; gap:8px; padding:2px 4px 10px}
.col-h b{font-size:13.5px}
.col-h .n{font-size:12px; color:var(--ink-3); font-weight:600}
.col-h .s{margin-left:auto; font-size:12px; color:var(--ink-3)}
.col-line{height:3px; border-radius:3px; margin:0 4px 10px; background:var(--rose-line)}
.col-body{display:flex; flex-direction:column; gap:8px; overflow:hidden}
.lc{background:#fff; border:1px solid var(--border); border-radius:12px; padding:11px 12px; box-shadow:var(--sh)}
.lc .a{display:flex; align-items:center; gap:6px}
.lc .a b{font-size:13.5px; font-weight:600; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.lc .b{display:flex; align-items:center; gap:6px; margin-top:3px; font-size:12.5px; color:var(--ink-2)}
.lc .b .m{margin-left:auto; font-weight:600; color:var(--ink)}
.lc .c{display:flex; align-items:center; gap:6px; margin-top:9px}
.lc .c .tk{margin-left:auto; font-size:11.5px; color:var(--ink-3)}
.lc.drag{transform:rotate(-1.5deg); box-shadow:var(--sh-pop); border-color:var(--rose-line)}
.flame{color:#E0663D; width:14px; height:14px; flex:none}
.col-add{border:1px dashed var(--border); border-radius:12px; padding:9px; text-align:center; color:var(--ink-3); font-size:12.5px; background:none}

/* ---------- Bảng ---------- */
table.tb{width:100%; border-collapse:separate; border-spacing:0; font-size:13px}
.tb th{position:sticky; top:0; background:var(--bg); text-align:left; font-weight:600; font-size:12px; color:var(--ink-3); padding:9px 12px; border-bottom:1px solid var(--border)}
.tb td{padding:10px 12px; border-bottom:1px solid var(--border-soft); white-space:nowrap; background:#fff}
.tb tr:hover td{background:var(--rose-50)}
.tb td.r, .tb th.r{text-align:right}
.tb .nm{display:flex; align-items:center; gap:10px; font-weight:600}
.tb tfoot td{background:var(--bg); font-weight:700; border-bottom:0}
.tb input[type=checkbox]{accent-color:var(--rose)}

/* ---------- Chi tiết lead ---------- */
.lead{display:grid; grid-template-columns:minmax(0,1fr) 340px; height:100%; min-height:0}
.lead-main{display:flex; flex-direction:column; min-height:0; border-right:1px solid var(--border)}
.lead-head{padding:18px 24px 0; background:#fff; border-bottom:1px solid var(--border)}
.lh1{display:flex; align-items:center; gap:12px}
.lh1 h2{white-space:nowrap; margin:0; font-size:20px; letter-spacing:-.01em}
.lh1 .meta{color:var(--ink-2); font-size:13px}
.lh1 .acts{margin-left:auto; display:flex; gap:8px}
.steps{display:flex; gap:4px; margin:16px 0 0}
.step{flex:1; font-size:12px; font-weight:500; color:var(--ink-3); padding:0 0 10px; position:relative; border:0; background:none; text-align:left}
.step::before{content:""; display:block; height:4px; border-radius:4px; background:var(--well); margin-bottom:7px}
.step.done::before{background:var(--rose-line)} .step.done{color:var(--ink-2)}
.step.cur::before{background:var(--rose-grad)} .step.cur{color:var(--rose-ink); font-weight:700}
.tabs{display:flex; gap:20px; margin-top:4px}
.tab{border:0; background:none; padding:10px 0 11px; font-size:13.5px; font-weight:500; color:var(--ink-2); border-bottom:2px solid transparent}
.tab.on{color:var(--ink); font-weight:600; border-image:var(--rose-grad) 1}
.tab .c{font-size:11.5px; color:var(--ink-3); margin-left:3px}
.tl{flex:1; min-height:0; overflow:hidden; padding:18px 24px; background:var(--bg)}
.tl-day{font-size:11.5px; font-weight:600; color:var(--ink-3); text-align:center; margin:4px 0 12px}
.msg{display:flex; gap:8px; margin-bottom:10px; max-width:76%}
.msg .bb{background:#fff; border:1px solid var(--border); padding:8px 12px; border-radius:14px 14px 14px 4px; font-size:13.5px}
.msg .tm{font-size:11px; color:var(--ink-3); margin-top:3px}
.msg.me{margin-left:auto; flex-direction:row-reverse}
.msg.me .bb{background:var(--rose-soft); border-color:var(--rose-line); border-radius:14px 14px 4px 14px}
.msg.me .tm{text-align:right}
.ev{display:flex; align-items:flex-start; gap:10px; margin:6px 0 14px; padding:10px 12px; border-radius:12px; background:#fff; border:1px dashed var(--border); font-size:13px}
.ev .ic{width:26px; height:26px; flex:none; border-radius:8px; display:grid; place-items:center; background:var(--amber-soft); color:var(--amber)}
.ev .ic svg{width:15px; height:15px}
.ev .ic.v{background:var(--violet-soft); color:var(--violet)}
.ev .x{flex:1} .ev .x div{color:var(--ink-3); font-size:12px}
.composer{flex:none; padding:12px 24px 16px; background:var(--bg)}
.composer .box{display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--border); border-radius:12px; padding:8px 8px 8px 14px; color:var(--ink-3); font-size:13.5px}
.composer .box .seg{margin-right:4px}
.composer .box .seg button{padding:3px 10px; font-size:12.5px}
.composer .box .btn{margin-left:auto}
.lead-side{overflow:hidden; padding:18px 20px; display:flex; flex-direction:column; gap:18px; background:#fff}
.ls h4{margin:0 0 10px; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-3); font-weight:600; display:flex; align-items:center}
.ls h4 a{margin-left:auto; text-transform:none; letter-spacing:0; color:var(--rose-ink); font-size:12.5px}
.kv{display:grid; grid-template-columns:96px 1fr; gap:7px 10px; font-size:13px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0; font-weight:500; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.kv dd a{color:var(--rose-ink); text-decoration:none}
.task{display:flex; align-items:center; gap:10px; padding:7px 0; font-size:13px; border-bottom:1px solid var(--border-soft)}
.task .bx{width:16px; height:16px; border-radius:5px; border:1.5px solid #CDBFB9; flex:none}
.task .bx.ok{background:var(--rose-grad); border-color:transparent; position:relative}
.task .bx.ok::after{content:""; position:absolute; left:4px; top:1px; width:4px; height:8px; border:solid #fff; border-width:0 2px 2px 0; transform:rotate(45deg)}
.task.done span{text-decoration:line-through; color:var(--ink-3)}
.task .due{margin-left:auto}
.money{display:flex; align-items:baseline; gap:8px}
.money b{font-size:22px; letter-spacing:-.02em}
.next{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px}

/* ---------- Hội thoại ---------- */
.conv{display:grid; grid-template-columns:320px 1fr 300px; height:100%; min-height:0}
.cv-list{border-right:1px solid var(--border); background:#fff; display:flex; flex-direction:column; min-height:0}
.cv-f{display:flex; gap:6px; padding:12px 14px; border-bottom:1px solid var(--border-soft)}
.cv-f .chip{height:28px; font-size:12.5px; padding:0 10px}
.cv{display:flex; gap:10px; padding:11px 14px; border-bottom:1px solid var(--border-soft)}
.cv.on{background:var(--rose-50); position:relative} .cv.on::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--rose-grad)}
.cv .t{flex:1; min-width:0}
.cv .t .n{display:flex; gap:6px; align-items:baseline}
.cv .t .n b{font-size:13.5px; font-weight:600; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.cv .t .n span{font-size:11.5px; color:var(--ink-3)}
.cv .t p{margin:2px 0 5px; font-size:12.5px; color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.cv-chat{display:flex; flex-direction:column; min-height:0; background:var(--bg)}
.cv-chat-h{display:flex; align-items:center; gap:10px; padding:12px 20px; background:#fff; border-bottom:1px solid var(--border)}
.cv-chat-h b{font-size:14.5px}
.sync{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-2)}
.sync .dot{color:#21946C; box-shadow:0 0 0 3px #E3F3EC}
.wait{display:flex; align-items:center; gap:10px; margin:12px 20px 0; padding:9px 12px; border-radius:10px; background:var(--red-soft); color:var(--red); font-size:13px}
.wait svg{width:16px; height:16px; flex:none}
.wait b{font-weight:600}
.wait .btn{margin-left:auto; border-color:transparent}
.msg .bb{position:relative}
.msg.hl{margin-top:44px} .msg.hl .bb{box-shadow:0 0 0 2px var(--rose-line)}
.macts{position:absolute; top:-36px; left:0; display:flex; gap:2px; background:#fff; border:1px solid var(--border); border-radius:9px; padding:3px; box-shadow:0 6px 18px rgba(32,27,30,.12)}
.macts button{display:flex; align-items:center; gap:5px; border:0; background:none; font-size:12px; font-weight:600; color:var(--ink-2); padding:3px 8px; border-radius:6px; white-space:nowrap}
.macts button:hover{background:var(--rose-soft); color:var(--rose-ink)}
.macts svg{width:13px; height:13px}
.ro{flex:none; display:flex; align-items:center; gap:10px; padding:12px 20px; border-top:1px solid var(--border); background:#fff; font-size:13px; color:var(--ink-2)}
.ro svg{width:16px; height:16px; color:var(--ink-3); flex:none}
.ro .btn{margin-left:auto}
.ro .btn svg{color:inherit}
.sum{background:var(--rose-50); border:1px solid var(--rose-line); border-radius:12px; padding:12px 14px; font-size:13px}
.sum ul{margin:6px 0 0; padding-left:16px; color:var(--ink-2)} .sum li{margin:3px 0}
.sum .src{font-size:11.5px; color:var(--ink-3); margin-top:8px}
.cv .new{font-size:11px; font-weight:700; color:#fff; background:var(--rose-grad); border-radius:99px; padding:0 6px; margin-left:auto}
.zb{background:#fff; border:1px solid var(--border); border-radius:12px; margin:6px 0 14px; overflow:hidden}
.zb-h{display:flex; align-items:center; gap:8px; padding:9px 12px; border-bottom:1px solid var(--border-soft); font-size:12.5px; color:var(--ink-2)}
.zb-h svg{width:15px; height:15px; color:var(--ink-3)}
.zb-h a{margin-left:auto; color:var(--rose-ink); font-weight:600}
.zm{display:flex; gap:10px; padding:7px 12px; font-size:13.5px}
.zm .w{flex:none; width:92px; font-size:12px; color:var(--ink-3); padding-top:1px}
.zm .w b{display:inline; margin-right:4px; color:var(--ink-2); font-weight:600}
.zm.kh .w b{color:var(--rose-ink)}
.cv-side{background:#fff; border-left:1px solid var(--border); padding:18px; display:flex; flex-direction:column; gap:18px; overflow:hidden}

/* ---------- Báo cáo ---------- */
.rp-tools{display:flex; align-items:center; gap:8px; margin-bottom:16px}
.period{display:flex; align-items:center; gap:4px; background:#fff; border:1px solid var(--border); border-radius:10px; padding:3px}
.period b{font-size:13px; padding:0 8px}
.period .ic-btn{width:28px; height:28px}
.kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:12px}
.rp-grid{display:grid; grid-template-columns:1.5fr 1fr; gap:12px}
.chart{padding:4px 16px 14px}
.funnel{padding:4px 16px 14px; display:flex; flex-direction:column; gap:9px}
.fn{display:grid; grid-template-columns:110px 1fr 70px; align-items:center; gap:10px; font-size:13px}
.fn .bar{height:22px; border-radius:6px; background:var(--rose-50)}
.fn .bar i{border-radius:6px; background:linear-gradient(90deg,#3DB386,#1F8F6A)}
.fn .p{text-align:right; color:var(--ink-2)}
.lost{padding:0 16px 14px; display:flex; flex-direction:column; gap:10px; font-size:13px}
.lost .ln{display:flex; justify-content:space-between; margin-bottom:4px}
.lost .bar i{background:#A9C9BB}

/* ---------- Venue ---------- */
.vgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px}
.vc{overflow:hidden}
.vc .img{height:118px; position:relative}
.vc .img .tones{position:absolute; left:10px; bottom:10px; display:flex; gap:4px}
.vc .img .tones i{width:16px; height:16px; border-radius:50%; border:2px solid #fff}
.vc .bd{padding:12px 14px}
.vc .bd b{font-size:14px}
.vc .bd .m{display:flex; gap:10px; margin-top:6px; font-size:12.5px; color:var(--ink-2)}
.vc .bd .m span{display:flex; align-items:center; gap:4px}
.vc .bd .m svg{width:14px; height:14px; color:var(--ink-3)}

/* ---------- Điện thoại ---------- */
.phones{display:flex; gap:48px; justify-content:center; padding:32px 0; background:linear-gradient(180deg,#EAF3EE,#E8EEEA); border-radius:20px}
.phone{width:375px; height:780px; border-radius:48px; background:#1d1a1c; padding:11px; box-shadow:var(--sh-pop)}
.scr{width:100%; height:100%; border-radius:38px; overflow:hidden; background:var(--bg); display:flex; flex-direction:column; position:relative}
.sb{height:44px; flex:none; display:flex; align-items:center; justify-content:space-between; padding:0 28px 0 32px; font-size:14px; font-weight:600}
.island{position:absolute; top:10px; left:50%; transform:translateX(-50%); width:110px; height:30px; background:#000; border-radius:20px}
.m-top{padding:6px 18px 12px; display:flex; align-items:center; gap:10px}
.m-top h2{margin:0; font-size:24px; letter-spacing:-.02em}
.m-body{flex:1; overflow:hidden; padding:0 14px; display:flex; flex-direction:column; gap:12px}
.m-tab{flex:none; height:82px; background:#fff; border-top:1px solid var(--border); display:grid; grid-template-columns:repeat(5,1fr); padding:8px 6px 0}
.m-tab div{display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10.5px; font-weight:500; color:var(--ink-3); position:relative}
.m-tab svg{width:22px; height:22px}
.m-tab .on{color:var(--rose)}
.m-tab .plus{width:44px; height:44px; border-radius:14px; background:var(--rose-grad); box-shadow:0 6px 16px -6px rgba(31,143,106,.7); color:#fff; display:grid; place-items:center; margin-top:-4px}
.m-tab .bdg{position:absolute; top:-3px; left:calc(50% + 4px); background:var(--rose-grad); color:#fff; font-size:10px; font-weight:700; border-radius:99px; padding:0 5px; border:2px solid #fff}

/* ---------- Tổng quan ---------- */
.ov{display:grid; grid-template-columns:repeat(3,1fr); gap:14px}
.ov .card{padding:18px}
.ov h3{margin:10px 0 6px; font-size:15px}
.ov p{margin:0; color:var(--ink-2); font-size:13.5px}
.ov .ix{width:34px; height:34px; border-radius:10px; background:var(--rose-grad-soft); color:var(--rose); display:grid; place-items:center}
.ov .ix svg{width:18px; height:18px}
.ov a{color:var(--rose-ink); font-weight:600; font-size:13px; text-decoration:none; display:inline-block; margin-top:10px}
.sw{display:flex; gap:10px; flex-wrap:wrap; margin:18px 0 6px}
.sw div{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ink-2); background:#fff; border:1px solid var(--border); border-radius:999px; padding:4px 12px 4px 4px}
.sw i{width:22px; height:22px; border-radius:50%; border:1px solid rgba(0,0,0,.06)}
.hero{display:grid; grid-template-columns:1fr 1fr; gap:28px; align-items:center; margin-bottom:24px}
.hero h2{font-size:30px; line-height:1.15; letter-spacing:-.02em; margin:0 0 10px}
.hero h2 em{font-style:normal; background:var(--rose-grad); -webkit-background-clip:text; background-clip:text; color:transparent}
.hero p{color:var(--ink-2); font-size:15px; margin:0}
.thumb{height:260px; overflow:hidden; border-radius:16px; box-shadow:var(--sh-pop); position:relative}
.thumb .app{transform:scale(.52); transform-origin:0 0; pointer-events:none}
</style>
</head>
<body>

<header class="mk-head"><div class="mk-in">
  <div class="mk-title"><span class="logo" id="logoTop"></span>HayDay CRM <small>Đề xuất giao diện mới · dữ liệu giả</small></div>
  <nav class="mk-tabs" id="mkTabs"></nav>
</div></header>

<main class="mk-body">
  <section class="view" id="tong-quan"></section>
  <section class="view" id="hom-nay"></section>
  <section class="view" id="pipeline"></section>
  <section class="view" id="danh-sach"></section>
  <section class="view" id="lead"></section>
  <section class="view" id="hoi-thoai"></section>
  <section class="view" id="bao-cao"></section>
  <section class="view" id="venue"></section>
  <section class="view" id="dien-thoai"></section>
</main>

<script>
/* Icon nét mảnh, cùng phong cách lucide */
const P = {
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  kanban:'<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 7v7M12 7v4M16 7v9"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  chat:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',
  chart:'<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>',
  pin:'<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
  inbox:'<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13L22 12v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  dots:'<circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>',
  down:'<path d="m6 9 6 6 6-6"/>',
  left:'<path d="m15 18-6-6 6-6"/>', right:'<path d="m9 18 6-6-6-6"/>',
  check:'<path d="M20 6 9 17l-5-5"/>', x:'<path d="M18 6 6 18M6 6l12 12"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  alert:'<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
  cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  flame:'<path d="M12 22c4 0 7-2.7 7-7 0-4-3-6.5-4-9-1 2-2 3-3.5 3.5C11 7 10 4.5 10 2 7 4 5 8 5 15c0 4.3 3 7 7 7z"/>',
  link:'<path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>',
  file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h4"/>',
  phone:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>',
  filter:'<path d="M22 3H2l8 9.5V19l4 2v-8.5z"/>',
  cols:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18"/>',
  dl:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
  img:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/>',
  claude:'<path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6 5.6 18.4"/>',
  eye:'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  grip:'<circle cx="9" cy="6" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="18" r="1"/>',
  lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  ext:'<path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
  task:'<rect x="3" y="3" width="18" height="18" rx="3"/><path d="m8 12 3 3 5-6"/>',
  note:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  copy:'<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
  zalo:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 10h5l-5 4h5"/>',
};
const ic = (n, s='') => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ${s}>${P[n]}</svg>`;
const tulip = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 13v8" stroke="#5F9E7F" stroke-width="1.8" stroke-linecap="round"/><path d="M12 19c-2-2.4-4.5-3-6-2.6M12 18c1.6-2 3.6-2.5 5-2.2" stroke="#5F9E7F" stroke-width="1.6" stroke-linecap="round"/><path d="M7 4.5c1.6 1 2.6 2 3 3.3L12 4l2 3.8c.4-1.3 1.4-2.3 3-3.3.6 4.2-.6 8.5-5 8.5S6.4 8.7 7 4.5z" fill="#C0546E"/></svg>`;
document.getElementById('logoTop').innerHTML = tulip;

/* ---------- Khung chung ---------- */
const NAV = [
  ['hom-nay','home','Hôm nay','5','hot'],
  ['pipeline','kanban','Lead','47'],
  ['hoi-thoai','chat','Hội thoại','2','hot'],
  ['bao-cao','chart','Báo cáo'],
  ['venue','pin','Venue'],
];
function side(on){
  const items = NAV.map(([id,i,t,b,h]) => `<button class="ni ${id===on||(on==='danh-sach'&&id==='pipeline')||(on==='lead'&&id==='pipeline')?'on':''}">${ic(i)}${t}${b?`<span class="bd ${h||''}">${b}</span>`:''}</button>`).join('');
  return `<aside class="side">
    <div class="brand"><span class="logo">${tulip}</span><div><b>HayDay CRM</b><button class="kho">Kho của Trân ${ic('down','width="12" height="12"')}</button></div></div>
    <div class="nav">${items}</div>
    <div class="nav-l">Claude</div>
    <div class="nav"><button class="ni">${ic('inbox')}Đề xuất chờ duyệt<span class="bd">3</span></button></div>
    <div class="side-foot"><span class="av">HT</span><div class="who">Huyền Trân<small>Sale · Admin</small></div><button class="ic-btn" aria-label="Thêm">${ic('dots')}</button></div>
  </aside>`;
}
function topbar(title, sub, extra=''){
  return `<div class="top"><h1>${title}</h1>${sub?`<span class="sub">${sub}</span>`:''}
    <div class="search">${ic('search')}Tìm khách, số điện thoại…<span class="kbd">Ctrl K</span></div>${extra}
    <button class="btn pri">${ic('plus')}Thêm lead</button></div>`;
}
const app = (on, title, sub, body, extra) => `<div class="scroller"><div class="app">${side(on)}<div class="main">${title?topbar(title,sub,extra):''}${body}</div></div></div>`;
const note = h => `<p class="note">${h}</p>`;

/* ---------- Dữ liệu giả ---------- */
const AV = ['', 'b','c','d','e'];
const ini = n => { const w = n.split(' '); return w[0][0] + w[w.length-1][0]; };

/* ---------- Hôm nay ---------- */
const urgent = [
  ['Nguyễn Thị Lan','Khách hỏi lịch trống ngày 31/1 · 1 giờ trước','Báo giá','45tr',0],
  ['Bùi Anh Thư','“Gói Signature có quay flycam không ạ?” · 40 phút','Báo giá','48tr',2],
];
const late = [['Trần Ngọc Hân','Gọi lại xác nhận buổi gặp · trễ 2 ngày','Follow up 1','32tr',3],['Lý Kim Ngân','Gửi lại báo giá bản 2 · trễ 1 ngày','Báo giá','35tr',1]];
const due = [['Huỳnh Gia Hân','Hẹn đi xem Gem Center','Lead in','8tr',4],['Phạm Thảo Vy','Hỏi lại về album','Follow up 2','22tr',0],['Mai Phương Thảo','Gửi link sản phẩm tone pastel','Lead in','20tr',2]];
const rows = (a, chip) => a.map(([n,t,s,m,c])=>`<div class="row"><span class="av ${AV[c]}">${ini(n)}</span><div class="t"><b>${n}</b><div>${t}</div></div>${chip}<span class="pill">${s}</span><span class="amt num">${m}</span></div>`).join('');
document.getElementById('hom-nay').innerHTML =
  note('<b>Màn mới “Hôm nay”</b> thay chỗ mở đầu bằng Pipeline. Mở app lên là thấy ngay việc phải làm, xếp theo độ gấp: khách đang chờ trả lời, việc trễ hẹn, việc hạn hôm nay. Bên phải là đề xuất của Claude chờ duyệt và link sản phẩm khách vừa mở.') +
  app('hom-nay','Hôm nay','Thứ năm, 05/11', `<div class="content"><div class="today">
    <div style="min-height:0; display:flex; flex-direction:column">
      <div class="hello"><div><h2>Chào buổi chiều, Trân ${tulip}</h2><p>7 việc cần làm · 2 khách đang chờ em trả lời</p></div></div>
      <div class="stats">
        <div class="card stat"><div class="l">Doanh thu · kỳ 6/10–5/11</div><div class="v num">52tr <small>/ 300tr</small></div><div class="bar"><i style="width:17%"></i></div></div>
        <div class="card stat"><div class="l">Lead mới</div><div class="v num">12</div><div class="d"><span class="up">+4</span> so kỳ trước</div></div>
        <div class="card stat"><div class="l">Đang chăm sóc</div><div class="v num">358tr</div><div class="d">11 lead</div></div>
        <div class="card stat"><div class="l">Tỉ lệ chốt</div><div class="v num">18%</div><div class="d"><span class="up">+3 điểm</span></div></div>
      </div>
      <div class="card" style="flex:1; min-height:0; overflow:hidden">
        <div class="card-h"><h3>Cần làm</h3><span class="muted" style="font-size:12.5px">7 việc</span><span class="more">Xem lịch 7 ngày</span></div>
        <div class="todo-g"><h4><span class="dot" style="color:var(--red)"></span>Khách đang chờ trả lời</h4>${rows(urgent,'')}</div>
        <div class="todo-g"><h4><span class="dot" style="color:var(--amber)"></span>Trễ hẹn</h4>${rows(late,'')}</div>
        <div class="todo-g"><h4><span class="dot" style="color:var(--ink-3)"></span>Hạn hôm nay</h4>${rows(due,'')}</div>
      </div>
    </div>
    <div style="display:flex; flex-direction:column; gap:16px; min-height:0">
      <div class="card">
        <div class="card-h"><h3>Claude đề xuất</h3><span class="pill rose">3 chờ duyệt</span></div>
        <div class="prop"><div class="who"><span class="av b" style="width:24px;height:24px;font-size:10px">NL</span><b>Nguyễn Thị Lan</b><span class="muted">· từ báo giá</span></div>
          <div class="chg">Doanh thu: <s>40.000.000</s> → <b>45.000.000</b></div>
          <div class="acts"><button class="btn sm pri">${ic('check')}Duyệt</button><button class="btn sm">Bỏ qua</button></div></div>
        <div class="prop"><div class="who"><span class="av c" style="width:24px;height:24px;font-size:10px">NH</span><b>Trần Ngọc Hân</b><span class="muted">· từ Zalo</span></div>
          <div class="chg">Ngày cưới: <b>05/03/2027</b></div>
          <div class="acts"><button class="btn sm pri">${ic('check')}Duyệt</button><button class="btn sm">Bỏ qua</button></div></div>
      </div>
      <div class="card" style="flex:1; min-height:0; overflow:hidden">
        <div class="card-h"><h3>Khách vừa mở link</h3><span class="more">Tất cả</span></div>
        ${[['Bùi Anh Thư','Album Gem Center · tone pastel','3 lần','12 phút',2],['Lý Kim Ngân','Phóng sự White Palace','1 lần','2 giờ',1],['Mai Phương Thảo','Bảng giá Signature 2027','2 lần','hôm qua',2]].map(([n,p,c,t,a])=>`<div class="link-row"><span class="av ${AV[a]}" style="width:28px;height:28px;font-size:11px">${ini(n)}</span><div class="t"><b>${n}</b><div>${p}</div></div><div style="text-align:right"><b class="num" style="font-size:12.5px">${c}</b><div class="muted" style="font-size:11.5px">${t}</div></div></div>`).join('')}
      </div>
    </div>
  </div></div>`);

/* ---------- Pipeline ---------- */
const COLS = [
  ['Lead in','46tr',[['Lê Minh Tuấn','Standard','04/04/27','18tr','cal','Còn 1 ngày',''],['Huỳnh Gia Hân','Gói lẻ','05/12/26','8tr','cal','Hôm nay','rose'],['Mai Phương Thảo','Standard','04/05/27','20tr','cal','Còn 4 ngày','']]],
  ['Báo giá','128tr',[['Nguyễn Thị Lan','Signature','31/01/27','45tr','zalo','Chờ trả lời · 1 giờ','red',1],['Bùi Anh Thư','Signature','08/02/27','48tr','zalo','Chờ trả lời · 40 phút','red',1,'drag'],['Lý Kim Ngân','Unique','19/01/27','35tr','alert','Trễ 1 ngày','amber']]],
  ['Follow up 1','72tr',[['Trần Ngọc Hân','Unique','05/03/27','32tr','alert','Trễ 2 ngày','amber'],['Đỗ Thùy Trang','Signature','23/02/27','40tr','cal','Còn 2 ngày','']]],
  ['Follow up 2','22tr',[['Phạm Thảo Vy','Standard','08/01/27','22tr','zalo','Khách im 5 ngày','slate']]],
  ['Follow up 3','60tr',[['Võ Ngọc Ánh','Signature','14/02/27','42tr','cal','Còn 6 ngày',''],['Đặng Mỹ Linh','Gói lẻ','20/12/26','18tr','zalo','Khách im 3 ngày','slate']]],

document.getElementById('mkTabs').innerHTML = VIEWS.map(([h,t])=>`<a href="#${h}" data-h="${h}">${t}</a>`).join('');
function route(){
  const h = VIEWS.some(([v])=>'#'+v===location.hash) ? location.hash.slice(1) : 'tong-quan';
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on', v.id===h));
  document.querySelectorAll('#mkTabs a').forEach(a=>a.classList.toggle('on', a.dataset.h===h));
  scrollTo(0,0);
}
addEventListener('hashchange', route); route();
