<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>CRM của Huyền Trân — Chế độ xem</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%23FBEAEE%22%2F%3E%3Cpath%20d%3D%22M9%2011.6c0-3.4%201.9-5.7%203.5-5.7%201%200%201.7%201%202%202.3.3-1.4.7-2.3%201.5-2.3s1.2.9%201.5%202.3c.3-1.3%201-2.3%202-2.3%201.6%200%203.5%202.3%203.5%205.7v1.2c0%204.6-3%207.5-6.7%207.5S9%2017.4%209%2012.8z%22%20fill%3D%22%23E8899B%22%2F%3E%3Cpath%20d%3D%22M15.2%2019h1.6v7.4h-1.6z%22%20fill%3D%22%231FAE6F%22%2F%3E%3Cpath%20d%3D%22M15.2%2025.6c-2.6-.1-4.5-1.4-5-3.5%202.5-.3%204.5%201%205%203.5z%22%20fill%3D%22%231FAE6F%22%2F%3E%3C%2Fsvg%3E">
  <meta name="theme-color" content="#1FAE6F">
<!--
  TRANG CHỈ XEM.
  Cố ý KHÔNG nhúng Firebase SDK và không có bất kỳ lệnh ghi nào. Toàn bộ dữ liệu
  lấy qua POST /api/share; server mới là bên có quyền đọc database. Trình duyệt
  người xem không hề có thông tin đăng nhập nào để mà sửa dữ liệu.
-->
<style>
  :root{
    --green-50:#EAF7F0; --green-100:#CFEEDD; --green-500:#1FAE6F; --green-600:#178F5B; --green-700:#0F6E45;
    --ink:#1C2622; --ink-soft:#5B6B64; --ink-faint:#8B9992;
    --bg:#F5F7F4; --card:#FFFFFF; --border:#E4E8E2; --border-soft:#EDF0EB;
    --blush:#E8899B; --blush-soft:#FBEAEE; --red:#DD525C; --red-soft:#FCEBEC;
    --gray-tag:#94A099; --gray-tag-soft:#EEF1ED; --amber:#C98A2E; --amber-soft:#FBF1DF;
    --purple:#8467C9; --purple-soft:#F1ECFB; --slate:#6E88A0; --slate-soft:#EAF0F5;
    --radius-sm:6px; --radius-md:10px; --radius-lg:18px;
    --shadow-card:0 1px 2px rgba(28,38,34,.07), 0 1px 1px rgba(28,38,34,.04);
  }
  *,*::before,*::after{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink);
    font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
    font-size:14px; -webkit-font-smoothing:antialiased;}
  h1,h2,h3,p{margin:0;}
  .wrap{max-width:1400px; margin:0 auto; padding:20px 18px 60px;}

  /* ---------- Màn nhập mật khẩu ---------- */
  .gate{position:fixed; inset:0; background:var(--bg); z-index:60; display:flex; align-items:center; justify-content:center; padding:20px;}
  .gate.hidden{display:none;}
  .gate-card{background:var(--card); border-radius:var(--radius-lg); padding:32px 28px;
    box-shadow:0 20px 48px rgba(20,28,25,.12); max-width:360px; width:100%; text-align:center;}
  .gate-icon{font-size:34px; margin-bottom:10px;}
  .gate-title{font-weight:800; font-size:17px; margin-bottom:5px;}
  .gate-sub{font-size:12.5px; color:var(--ink-faint); font-weight:500; margin-bottom:20px; line-height:1.55;}
  .gate-input{width:100%; border:1px solid var(--border); border-radius:var(--radius-sm); padding:11px 14px;
    font-size:16px; outline:none; text-align:center; letter-spacing:.25em; font-weight:700; font-family:inherit; margin-bottom:12px;}
  .gate-input:focus{border-color:var(--green-500);}
  .gate-btn{width:100%; border:0; border-radius:var(--radius-sm); padding:11px 14px; background:var(--green-500);
    color:#fff; font-weight:800; font-size:14px; font-family:inherit; cursor:pointer;}
  .gate-btn:hover{background:var(--green-600);}
  .gate-btn:disabled{opacity:.6; cursor:not-allowed;}
  .gate-err{font-size:12px; color:var(--red); font-weight:600; margin-top:10px; min-height:16px; line-height:1.5;}

  /* ---------- Đầu trang ---------- */
  .top{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:16px;}
  .top h1{font-size:19px; font-weight:800;}
  .top .sub{font-size:12.5px; color:var(--ink-faint); font-weight:500; margin-top:2px;}
  .badge-readonly{display:inline-flex; align-items:center; gap:6px; flex:none; background:var(--slate-soft);
    color:var(--slate); border-radius:999px; padding:6px 13px; font-size:11.5px; font-weight:800;}

  .controls{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:18px;}
  .ctrl-btn{border:1px solid var(--border); background:var(--card); border-radius:var(--radius-sm);
    padding:7px 11px; font-size:12.5px; font-weight:700; font-family:inherit; cursor:pointer; color:var(--ink);}
  .ctrl-btn:hover{border-color:var(--green-500); color:var(--green-600);}
  .ctrl-btn:disabled{opacity:.45; cursor:not-allowed;}
  .ctrl-month{font-size:13px; font-weight:800; min-width:120px; text-align:center;}
  select.ctrl-btn{padding-right:26px;}
  .loading{font-size:12px; color:var(--ink-faint); font-weight:700;}

  /* ---------- Thẻ số liệu ---------- */
  .grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(205px,1fr)); gap:12px; margin-bottom:8px;}
  .box{background:var(--card); border:1px solid var(--border); border-radius:var(--radius-md); padding:14px 16px; box-shadow:var(--shadow-card);}
  .box.clickable{cursor:pointer; transition:border-color .15s, transform .1s;}
  .box.clickable:hover{border-color:var(--green-500); transform:translateY(-1px);}
  .box.clickable:active{transform:none;}
  .box-label{font-size:11px; font-weight:800; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.04em; display:flex; align-items:center; gap:5px;}
  .box-value{font-size:21px; font-weight:800; margin-top:5px; font-variant-numeric:tabular-nums;}
  .box-sub{font-size:11.5px; color:var(--ink-faint); font-weight:600; margin-top:3px;}
  .box-value.red{color:var(--red);} .box-value.green{color:var(--green-600);}
  .bar{height:5px; background:var(--border-soft); border-radius:999px; margin-top:9px; overflow:hidden;}
  .bar span{display:block; height:100%; background:var(--green-500); border-radius:999px;}
  .hint{font-size:10px; color:var(--green-600); font-weight:800;}

  h2.sec{font-size:14px; font-weight:800; margin:26px 0 12px; display:flex; align-items:center; gap:8px;}
  h2.sec::after{content:''; flex:1; height:1px; background:var(--border);}

  /* ---------- Phễu ---------- */
  .funnel{background:var(--card); border:1px solid var(--border); border-radius:var(--radius-md); padding:14px 16px; box-shadow:var(--shadow-card);}
  .fn-row{display:flex; align-items:center; gap:10px; margin-bottom:7px; font-size:12px; font-weight:600; cursor:pointer; border-radius:var(--radius-sm); padding:3px 5px;}
  .fn-row:last-child{margin-bottom:0;}
  .fn-row:hover{background:var(--green-50);}
  .fn-name{flex:0 0 130px; min-width:0; overflow-wrap:anywhere;}
  .fn-bar{flex:1; height:8px; background:var(--border-soft); border-radius:999px; overflow:hidden; min-width:40px;}
  .fn-bar span{display:block; height:100%; background:var(--green-500); border-radius:999px;}
  .fn-num{flex:none; width:26px; text-align:right; font-weight:800; font-variant-numeric:tabular-nums;}

  /* ---------- Bảng pipeline ---------- */
  .board{display:flex; gap:12px; overflow-x:auto; padding-bottom:10px;}
  .col{flex:0 0 240px; background:var(--card); border:1px solid var(--border); border-radius:var(--radius-md); padding:11px; min-width:0;}
  .col-head{display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:9px; padding-bottom:8px; border-bottom:1px solid var(--border-soft);}
  .col-name{font-size:11.5px; font-weight:800; text-transform:uppercase; letter-spacing:.03em;}
  .col-count{font-size:11px; font-weight:800; color:var(--ink-faint); background:var(--bg); border-radius:999px; padding:1px 8px; flex:none;}
  .col-sum{font-size:11px; color:var(--ink-faint); font-weight:700; margin-top:2px;}
  .card{background:var(--bg); border:1px solid var(--border-soft); border-left:3px solid var(--gray-tag);
    border-radius:var(--radius-sm); padding:9px 10px; margin-bottom:7px; cursor:pointer; transition:border-color .15s;}
  .card:hover{border-color:var(--green-500); border-left-color:var(--green-500);}
  .card.red{border-left-color:var(--red);} .card.green{border-left-color:var(--green-500);}
  .card.won{border-left-color:var(--green-600);} .card.lost{border-left-color:var(--gray-tag);}
  .card-name{font-size:12.5px; font-weight:700; overflow-wrap:anywhere;}
  .card-meta{font-size:11px; color:var(--ink-faint); font-weight:600; margin-top:3px; display:flex; gap:7px; flex-wrap:wrap;}
  .chip{border-radius:4px; padding:1px 6px; font-size:10px; font-weight:800;}
  .chip.red{color:var(--red); background:var(--red-soft);}
  .chip.green{color:var(--green-600); background:var(--green-50);}
  .chip.gray{color:var(--gray-tag); background:var(--gray-tag-soft);}
  .chip.pkg{color:var(--slate); background:var(--slate-soft);}
  .chip.won{color:var(--green-700); background:var(--green-50);}
  .chip.lost{color:var(--gray-tag); background:var(--gray-tag-soft);}
  .empty{font-size:11.5px; color:var(--ink-faint); text-align:center; padding:14px 0; font-weight:600;}

  /* ---------- Lý do mất deal ---------- */
  .reasons{background:var(--card); border:1px solid var(--border); border-radius:var(--radius-md); padding:14px 16px; box-shadow:var(--shadow-card);}
  .reason-row{display:flex; align-items:center; gap:10px; margin-bottom:8px; font-size:12px; font-weight:600;}
  .reason-row:last-child{margin-bottom:0;}
  .reason-name{flex:1; min-width:0; overflow-wrap:anywhere;}
  .reason-bar{flex:0 0 90px; height:6px; background:var(--border-soft); border-radius:999px; overflow:hidden;}
  .reason-bar span{display:block; height:100%; background:var(--blush); border-radius:999px;}
  .reason-num{flex:none; width:20px; text-align:right; font-weight:800; font-variant-numeric:tabular-nums;}

  /* ---------- Modal ---------- */
  .ov{position:fixed; inset:0; background:rgba(20,28,25,.4); z-index:70; display:none; align-items:center; justify-content:center; padding:16px;}
  .ov.show{display:flex;}
  .mo{background:var(--card); border-radius:var(--radius-lg); width:100%; max-width:560px; max-height:88vh;
    display:flex; flex-direction:column; box-shadow:0 20px 48px rgba(20,28,25,.2);}
  .mo-head{padding:18px 20px 12px; border-bottom:1px solid var(--border-soft);}
  .mo-head h3{font-size:16px; font-weight:800; overflow-wrap:anywhere;}
  .mo-head p{font-size:12px; color:var(--ink-faint); font-weight:600; margin-top:3px;}
  .mo-body{padding:16px 20px; overflow-y:auto; flex:1; min-height:0;}
  .mo-foot{padding:12px 20px 16px; border-top:1px solid var(--border-soft); display:flex; gap:8px; justify-content:flex-end;}
  .mo-btn{border:1px solid var(--border); background:var(--card); border-radius:var(--radius-sm); padding:8px 15px;
    font-size:13px; font-weight:700; font-family:inherit; cursor:pointer; color:var(--ink);}
  .mo-btn:hover{border-color:var(--green-500); color:var(--green-600);}

  .kv{display:grid; grid-template-columns:120px 1fr; gap:5px 12px; font-size:12.5px; margin-bottom:14px;}
  .kv dt{color:var(--ink-faint); font-weight:700;}
  .kv dd{margin:0; font-weight:600; overflow-wrap:anywhere;}
  .blk{margin-bottom:14px;}
  .blk-title{font-size:11px; font-weight:800; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px;}
  .note{background:var(--bg); border:1px solid var(--border-soft); border-radius:var(--radius-sm); padding:9px 11px; margin-bottom:6px;}
  .note-time{font-size:10.5px; color:var(--ink-faint); font-weight:700; margin-bottom:3px;}
  .note-text{font-size:12.5px; font-weight:500; white-space:pre-wrap; line-height:1.5; overflow-wrap:anywhere;}
  .note-text a{color:var(--green-700);}
  .todo{display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:600; padding:4px 0;}
  .todo .tick{flex:none; width:15px; height:15px; border-radius:4px; border:1.5px solid var(--border);
    display:flex; align-items:center; justify-content:center; font-size:10px; color:#fff;}
  .todo .tick.on{background:var(--green-500); border-color:var(--green-500);}
  .todo .txt{flex:1; min-width:0; overflow-wrap:anywhere;}
  .todo .txt.done{text-decoration:line-through; color:var(--ink-faint);}
  .log{font-size:12px; font-weight:600; padding:4px 0 4px 12px; border-left:2px solid var(--border); position:relative;}
  .log-t{font-size:10.5px; color:var(--ink-faint); font-weight:700;}
  .lrow{display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:var(--radius-sm);
    background:var(--bg); margin-bottom:6px; cursor:pointer; border:1px solid transparent;}
  .lrow:hover{border-color:var(--green-500);}
  .lrow-name{flex:1; min-width:0; font-size:12.5px; font-weight:700; overflow-wrap:anywhere;}
  .lrow-val{flex:none; font-size:12px; font-weight:700; color:var(--ink-soft); font-variant-numeric:tabular-nums;}

  footer{margin-top:34px; padding-top:16px; border-top:1px solid var(--border); font-size:11.5px; color:var(--ink-faint); font-weight:600; line-height:1.7;}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-card">
    <div class="gate-icon">🔒</div>
    <div class="gate-title">CRM của Huyền Trân</div>
    <div class="gate-sub">Nhập mật khẩu được cung cấp kèm đường link để xem báo cáo</div>
    <input class="gate-input" id="pass" type="password" inputmode="numeric" placeholder="Mật khẩu" autocomplete="off">
    <button class="gate-btn" id="btn">Xem báo cáo</button>
    <div class="gate-err" id="err"></div>
  </div>
</div>

<div class="wrap" id="app" style="display:none;"></div>

<div class="ov" id="ov">
  <div class="mo">
    <div class="mo-head"><h3 id="moTitle"></h3><p id="moSub"></p></div>
    <div class="mo-body" id="moBody"></div>
    <div class="mo-foot" id="moFoot"></div>
  </div>
</div>

<script>
(function(){
  var TOKEN = new URLSearchParams(location.search).get('t') || '';
  var phien = null;      // phiên xem, dùng thay mật khẩu cho các lần tải sau
  var duLieu = null;
  var dangTai = false;

  var gate = document.getElementById('gate'), app = document.getElementById('app');
  var pass = document.getElementById('pass'), btn = document.getElementById('btn'), err = document.getElementById('err');
  var ov = document.getElementById('ov');

  if (!TOKEN){
    err.textContent = 'Đường link thiếu mã truy cập. Hãy mở đúng link được gửi.';
    pass.disabled = true; btn.disabled = true;
  }

  /* ---------- Tiện ích ---------- */
  function esc(s){
    return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function linkify(t){
    return t.replace(/https?:\/\/[^\s<]+/g, function(u){
      return '<a href="'+u+'" target="_blank" rel="noopener noreferrer">'+u+'</a>';
    });
  }
  function tien(n){
    if (n === null || n === undefined || isNaN(n)) return '—';
    return Number(n).toLocaleString('vi-VN') + ' đ';
  }
  function ngay(s){
    if (!s) return '—';
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s));
    return m ? (m[3]+'/'+m[2]+'/'+m[1]) : String(s);
  }
  function thangNam(ym){
    if (!ym) return '—';
    var p = String(ym).split('-'); return p.length === 2 ? (p[1]+'/'+p[0]) : String(ym);
  }

  /* ---------- Gọi máy chủ ---------- */
  async function tai(opts){
    opts = opts || {};
    var body = { token: TOKEN };
    if (phien) body.session = phien; else body.passcode = opts.passcode || '';
    if (opts.don) body.don = opts.don;
    if (opts.lui !== undefined) body.lui = opts.lui;
    if (opts.tu) body.tu = opts.tu;
    if (opts.den) body.den = opts.den;
    if (opts.leadType !== undefined) body.leadType = opts.leadType;

    var res = await fetch('/api/share', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
    });
    var data = await res.json();
    if (!res.ok) throw new Error(data && data.loi ? data.loi : 'Không tải được dữ liệu.');
    if (data.session) phien = data.session;
    return data;
  }

  btn.addEventListener('click', moKhoa);
  pass.addEventListener('keydown', function(e){ if (e.key === 'Enter') moKhoa(); });

  async function moKhoa(){
    var pc = pass.value.trim();
    if (!pc){ err.textContent = 'Nhập mật khẩu giúp nhé.'; pass.focus(); return; }
    btn.disabled = true; pass.disabled = true; btn.textContent = 'Đang tải...'; err.textContent = '';
    try {
      duLieu = await tai({ passcode: pc });
      gate.classList.add('hidden'); app.style.display = '';
      ve();
    } catch(e){
      err.textContent = e.message || 'Không mở được. Thử lại sau.';
    } finally {
      btn.disabled = false; pass.disabled = false; btn.textContent = 'Xem báo cáo';
    }
  }

  async function taiLai(opts){
    if (dangTai) return;
    dangTai = true;
    var el = document.getElementById('trangThai');
    if (el) el.textContent = 'Đang tải...';
    try {
      duLieu = await tai(opts);
      ve();
    } catch(e){
      // Phiên hết hạn -> quay lại màn nhập mật khẩu
      phien = null;
      app.style.display = 'none'; gate.classList.remove('hidden');
      err.textContent = 'Phiên xem đã hết hạn. Nhập lại mật khẩu giúp nhé.';
    } finally { dangTai = false; }
  }

  /* ---------- Vẽ trang ---------- */
  function ve(){
    var d = duLieu, db = d.dashboard, h = '';

    h += '<div class="top">'
      + '<div><h1>CRM của Huyền Trân</h1>'
      + '<div class="sub">HayDay Wedding · số liệu tới ' + ngay(d.homNay) + '</div></div>'
      + '<div class="badge-readonly">👁 Chế độ chỉ xem</div></div>';

    /* Thanh điều khiển: đơn vị thời gian + lùi/tiến kỳ + lọc loại lead */
    var tuyChon = d.don === 'tuyChon';
    var DON = [['tuan','Theo tuần'],['thang','Theo tháng'],['quy','Theo quý'],['nam','Theo năm'],['tuyChon','Khoảng ngày tự chọn']];

    h += '<div class="controls">'
      + '<select class="ctrl-btn" onchange="XEM.doiDon(this.value)">'
      + DON.map(function(x){
          return '<option value="'+x[0]+'"' + (d.don === x[0] ? ' selected' : '') + '>'+x[1]+'</option>';
        }).join('')
      + '</select>';

    if (tuyChon){
      h += '<input type="date" class="ctrl-btn" id="tuNgay" value="' + esc(d.tu) + '">'
        + '<span style="color:var(--ink-faint);font-weight:700;">→</span>'
        + '<input type="date" class="ctrl-btn" id="denNgay" value="' + esc(d.den) + '">'
        + '<button class="ctrl-btn" onclick="XEM.xemKhoang()">Xem</button>';
    } else {
      h += '<button class="ctrl-btn" onclick="XEM.luiKy(1)" title="Kỳ trước">‹</button>'
        + '<span class="ctrl-month">' + esc(d.kyBaoCao) + '</span>'
        + '<button class="ctrl-btn" onclick="XEM.luiKy(-1)"' + (d.lui <= 0 ? ' disabled' : '') + ' title="Kỳ sau">›</button>'
        + (d.lui > 0 ? '<button class="ctrl-btn" onclick="XEM.veHienTai()">Hiện tại</button>' : '');
    }

    h += '<select class="ctrl-btn" onchange="XEM.doiLoai(this.value)">'
      + '<option value=""' + (!d.loaiLead ? ' selected' : '') + '>Tất cả loại lead</option>'
      + d.danhSachLoaiLead.map(function(t){
          return '<option value="'+esc(t)+'"' + (d.loaiLead === t ? ' selected' : '') + '>'+esc(t)+'</option>';
        }).join('')
      + '</select>'
      + '<span class="loading" id="trangThai"></span></div>'
      + '<div class="box-sub" style="margin:-10px 0 16px;">Số liệu trong kỳ: '
      + ngay(d.tu) + ' → ' + ngay(d.den) + '</div>';

    /* Thẻ số liệu — bấm được */
    h += '<div class="grid">'
      + the('Giá trị pipeline', tien(db.pipeline.giaTri), db.pipeline.soLead + ' lead đang chăm sóc', null, null, 'dangCham')
      + the('Doanh thu đã chốt', tien(db.doanhThuThucTe.soTien),
            db.doanhThuThucTe.soDeal + ' deal · ' + db.doanhThuThucTe.phanTram + '% kế hoạch',
            db.doanhThuThucTe.phanTram, null, 'won')
      + the('Lead mới trong kỳ', db.leadMoi.soLuong,
            'kế hoạch ' + db.leadMoi.keHoach + ' · ' + db.leadMoi.phanTram + '%', db.leadMoi.phanTram, null, 'moi')
      + the('Gắn nhãn tiềm năng 🔥', tien(db.tiemNang.soTien), db.tiemNang.soLead + ' lead', null, null, 'tiemNang')
      + the('Dự kiến chốt trong kỳ', tien(db.duKienChot.soTien), db.duKienChot.soLead + ' lead', null, null, 'duKien')
      + the('Trễ hẹn', db.treHen, 'cần liên hệ gấp', null, db.treHen > 0 ? 'red' : 'green', 'treHen')
      + the('Đến hạn hôm nay', db.denHanHomNay, 'theo lịch hẹn', null, null, 'homNay')
      + the('Việc đã hoàn thành ✓', db.todoHoanThanh.soViec,
            'trên ' + db.todoHoanThanh.soLead + ' lead trong kỳ', null, null, 'todoXong')
      + the('Deal cycle trung bình', db.dealCycle === null ? '—' : db.dealCycle + ' ngày', 'từ lúc tạo tới khi chốt')
      + '</div>';

    /* Phễu chuyển đổi */
    h += '<h2 class="sec">Phễu chuyển đổi · CR ' + db.crToWon + '%</h2><div class="funnel">';
    var maxPheu = Math.max.apply(null, db.pheu.map(function(p){ return p.soLead; }).concat([1]));
    db.pheu.forEach(function(p, i){
      h += '<div class="fn-row" onclick="XEM.moPheu(' + i + ')">'
        + '<div class="fn-name">' + esc(p.stageName) + '</div>'
        + '<div class="fn-bar"><span style="width:' + (p.soLead/maxPheu*100) + '%"></span></div>'
        + '<div class="fn-num">' + p.soLead + '</div></div>';
    });
    h += '<div class="box-sub" style="margin-top:8px;">Tính trên ' + db.leadMoi.soLuong
      + ' lead được tạo trong kỳ · bấm từng bước để xem danh sách</div></div>';

    /* Pipeline */
    h += '<h2 class="sec">Pipeline</h2><div class="board">';
    d.giaiDoan.forEach(function(g){
      var ds = d.leads.filter(function(l){ return l.stage === g.id; });
      var tong = ds.reduce(function(s,l){ return s + (g.id === 'won' ? (l.revenueActual||0) : (l.revenueExpected||0)); }, 0);
      h += '<div class="col"><div class="col-head"><div>'
        + '<div class="col-name">' + esc(g.name) + '</div>'
        + '<div class="col-sum">' + tien(tong) + '</div></div>'
        + '<div class="col-count">' + ds.length + '</div></div>';
      if (!ds.length) h += '<div class="empty">Chưa có lead nào</div>';
      ds.forEach(function(l){
        var cls = l.stage === 'won' ? 'won' : l.stage === 'lost' ? 'lost' : l.statusType;
        h += '<div class="card ' + cls + '" onclick="XEM.moLead(\'' + esc(l.id) + '\')">'
          + '<div class="card-name">' + (l.isPotential ? '🔥 ' : '') + esc(l.name) + '</div>'
          + '<div class="card-meta">'
          + '<span class="chip pkg">' + esc(l.package || '—') + '</span>'
          + '<span>' + tien(l.stage === 'won' ? l.revenueActual : l.revenueExpected) + '</span>'
          + (l.stage === 'won' || l.stage === 'lost' ? '' : '<span class="chip '+l.statusType+'">'+esc(l.status)+'</span>')
          + (l.weddingDate ? '<span>💍 ' + ngay(l.weddingDate) + '</span>' : '')
          + (l.soViec ? '<span>✓ ' + l.soViecXong + '/' + l.soViec + '</span>' : '')
          + '</div></div>';
      });
      h += '</div>';
    });
    h += '</div>';

    /* Lý do mất deal */
    var keys = Object.keys(db.lyDoMatDeal);
    var tongMat = keys.reduce(function(s,k){ return s + db.lyDoMatDeal[k]; }, 0);
    if (tongMat > 0){
      var mx = Math.max.apply(null, keys.map(function(k){ return db.lyDoMatDeal[k]; }));
      h += '<h2 class="sec">Lý do mất deal trong kỳ (' + db.soLost + ')</h2><div class="reasons">';
      keys.forEach(function(k){
        h += '<div class="reason-row"><div class="reason-name">' + esc(k) + '</div>'
          + '<div class="reason-bar"><span style="width:' + (mx ? db.lyDoMatDeal[k]/mx*100 : 0) + '%"></span></div>'
          + '<div class="reason-num">' + db.lyDoMatDeal[k] + '</div></div>';
      });
      h += '</div>';
    }

    h += '<footer>Trang này chỉ hiển thị số liệu, không thể chỉnh sửa dữ liệu.<br>'
      + 'Đã lược bỏ số điện thoại và Facebook của khách.<br>'
      + 'Tải lúc: ' + esc(new Date(d.thoiDiem).toLocaleString('vi-VN')) + '</footer>';

    app.innerHTML = h;
  }

  function the(nhan, giaTri, phu, phanTram, mau, khoa){
    return '<div class="box' + (khoa ? ' clickable" onclick="XEM.moDs(\''+khoa+'\')' : '') + '">'
      + '<div class="box-label">' + esc(nhan) + (khoa ? ' <span class="hint">▸</span>' : '') + '</div>'
      + '<div class="box-value' + (mau ? ' '+mau : '') + '">' + esc(giaTri) + '</div>'
      + '<div class="box-sub">' + esc(phu) + '</div>'
      + (phanTram === null || phanTram === undefined ? ''
          : '<div class="bar"><span style="width:' + Math.min(100, phanTram) + '%"></span></div>')
      + '</div>';
  }

  /* ---------- Modal ---------- */
  function moModal(tieuDe, phu, than, quayLai){
    document.getElementById('moTitle').textContent = tieuDe;
    document.getElementById('moSub').textContent = phu || '';
    document.getElementById('moBody').innerHTML = than;
    document.getElementById('moFoot').innerHTML =
      (quayLai ? '<button class="mo-btn" onclick="XEM.moDs(\''+quayLai+'\')">‹ Quay lại</button>' : '')
      + '<button class="mo-btn" onclick="XEM.dong()">Đóng</button>';
    ov.classList.add('show');
    document.getElementById('moBody').scrollTop = 0;
  }
  ov.addEventListener('click', function(e){ if (e.target === ov) dong(); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') dong(); });
  function dong(){ ov.classList.remove('show'); }

  var DS = {
    dangCham: { ten:'Lead đang chăm sóc', loc:function(l){ return l.stage!=='won' && l.stage!=='lost'; } },
    won:      { ten:'Deal đã chốt trong kỳ', loc:function(l){ return l.wonTrongKy; }, tien:'revenueActual' },
    moi:      { ten:'Lead mới trong kỳ', loc:function(l){ return l.taoTrongKy; } },
    tiemNang: { ten:'Lead gắn nhãn tiềm năng', loc:function(l){ return l.isPotential && l.stage!=='won' && l.stage!=='lost'; } },
    duKien:   { ten:'Dự kiến chốt trong kỳ', loc:function(l){ return l.stage!=='won' && l.stage!=='lost' && !!l.expectedCloseMonth && duLieu.thangTrongKy.indexOf(l.expectedCloseMonth) >= 0; } },
    treHen:   { ten:'Lead trễ hẹn', loc:function(l){ return l.stage!=='won' && l.stage!=='lost' && l.statusType==='red'; } },
    homNay:   { ten:'Lead đến hạn hôm nay', loc:function(l){ return l.stage!=='won' && l.stage!=='lost' && l.statusType==='green'; } }
  };

  function moDs(khoa){
    // Danh sách việc đã hoàn thành có cấu trúc khác (theo việc, không theo lead)
    if (khoa === 'todoXong') return moTodoXong();
    var c = DS[khoa]; if (!c) return;
    var ds = duLieu.leads.filter(c.loc);
    moModal(c.ten, ds.length + ' lead · ' + duLieu.kyBaoCao, dsHtml(ds, c.tien, khoa));
  }

  // Tuần bắt đầu từ THỨ HAI (kiểu Việt Nam). Tính bằng UTC để không bị múi giờ làm lệch ngày.
  var TEN_THU = ['CN','T2','T3','T4','T5','T6','T7'];
  function thuHaiCuaTuan(iso){
    var d = new Date(iso + 'T00:00:00Z');
    var thu = d.getUTCDay();                 // 0 = Chủ nhật
    d.setUTCDate(d.getUTCDate() - (thu === 0 ? 6 : thu - 1));
    return d.toISOString().slice(0, 10);
  }
  function thuCuaNgay(iso){
    return TEN_THU[new Date(iso + 'T00:00:00Z').getUTCDay()];
  }
  function nhanTuan(thuHaiIso){
    var tuanNay = thuHaiCuaTuan(duLieu.homNay);
    if (thuHaiIso === tuanNay) return 'Tuần này';
    var truoc = new Date(tuanNay + 'T00:00:00Z');
    truoc.setUTCDate(truoc.getUTCDate() - 7);
    if (thuHaiIso === truoc.toISOString().slice(0, 10)) return 'Tuần trước';
    var cn = new Date(thuHaiIso + 'T00:00:00Z');
    cn.setUTCDate(cn.getUTCDate() + 6);
    return ngay(thuHaiIso) + ' – ' + ngay(cn.toISOString().slice(0, 10));
  }

  function moTodoXong(){
    var ds = duLieu.todoHoanThanh || [];
    if (!ds.length){
      moModal('Việc đã hoàn thành', duLieu.kyBaoCao, '<div class="empty">Chưa có việc nào hoàn thành trong kỳ này.</div>');
      return;
    }
    // Gom theo TUẦN — nhìn ra được tuần nào chạy mạnh, tuần nào chững.
    // Ngày cụ thể vẫn hiện trên từng dòng nên không mất chi tiết.
    var theoTuan = {};
    ds.forEach(function(t){
      var k = thuHaiCuaTuan(t.completedAt);
      (theoTuan[k] = theoTuan[k] || []).push(t);
    });
    var cacTuan = Object.keys(theoTuan).sort().reverse();

    var h = cacTuan.map(function(tuan){
      var items = theoTuan[tuan].slice().sort(function(a,b){
        return String(b.completedAt).localeCompare(String(a.completedAt));
      });
      return '<div class="blk"><div class="blk-title">' + esc(nhanTuan(tuan))
        + ' · ' + items.length + ' việc</div>'
        + items.map(function(t){
            return '<div class="lrow" onclick="XEM.moLead(\'' + esc(t.leadId) + '\',\'todoXong\')">'
              + '<span class="tick on" style="flex:none;width:15px;height:15px;border-radius:4px;'
              + 'background:var(--green-500);color:#fff;display:flex;align-items:center;'
              + 'justify-content:center;font-size:10px;">✓</span>'
              + '<span class="lrow-name">' + esc(t.text)
              + '<br><span style="font-size:11px;color:var(--ink-faint);font-weight:600;">'
              + esc(t.leadName) + ' · ' + esc(t.stageName) + '</span></span>'
              + '<span class="lrow-val" style="font-size:11px;">' + esc(thuCuaNgay(t.completedAt))
              + '<br>' + esc(ngay(t.completedAt).slice(0, 5)) + '</span></div>';
          }).join('')
        + '</div>';
    }).join('');

    moModal('Việc đã hoàn thành',
      ds.length + ' việc trên ' + duLieu.dashboard.todoHoanThanh.soLead + ' lead · ' + duLieu.kyBaoCao, h);
  }

  function moPheu(i){
    var p = duLieu.dashboard.pheu[i];
    var ds = duLieu.leads.filter(function(l){ return l.taoTrongKy && l.reachedIndex >= i; });
    moModal('Đã đạt tới: ' + p.stageName,
      ds.length + ' lead tạo trong kỳ từng đạt bước này', dsHtml(ds, null, 'pheu'+i));
  }

  function dsHtml(ds, truong, tuDau){
    if (!ds.length) return '<div class="empty">Không có lead nào.</div>';
    return ds.map(function(l){
      var v = truong === 'revenueActual' ? l.revenueActual : l.revenueExpected;
      return '<div class="lrow" onclick="XEM.moLead(\''+esc(l.id)+'\',\''+esc(tuDau||'')+'\')">'
        + '<span class="lrow-name">' + (l.isPotential?'🔥 ':'') + esc(l.name)
        + '<br><span style="font-size:11px;color:var(--ink-faint);font-weight:600;">'
        + esc(l.stageName) + (l.stage!=='won'&&l.stage!=='lost' ? ' · '+esc(l.status) : '') + '</span></span>'
        + '<span class="lrow-val">' + tien(v) + '</span></div>';
    }).join('');
  }

  function moLead(id, tuDau){
    var l = duLieu.leads.filter(function(x){ return x.id === id; })[0];
    if (!l) return;
    var h = '';

    h += '<dl class="kv">'
      + '<dt>Giai đoạn</dt><dd>' + esc(l.stageName) + '</dd>'
      + '<dt>Loại lead</dt><dd>' + esc(l.leadType) + '</dd>'
      + '<dt>Gói dịch vụ</dt><dd>' + esc(l.package || '—') + '</dd>'
      + '<dt>Doanh thu dự kiến</dt><dd>' + tien(l.revenueExpected) + '</dd>'
      + (l.stage === 'won' ? '<dt>Doanh thu thực tế</dt><dd>' + tien(l.revenueActual) + '</dd>' : '')
      + '<dt>Ngày cưới</dt><dd>' + ngay(l.weddingDate) + '</dd>'
      + '<dt>Hạn liên hệ</dt><dd>' + ngay(l.deadline) + (l.stage!=='won'&&l.stage!=='lost' ? ' · '+esc(l.status) : '') + '</dd>'
      + '<dt>Tháng chốt dự kiến</dt><dd>' + thangNam(l.expectedCloseMonth) + '</dd>'
      + '<dt>Ngày tạo</dt><dd>' + ngay(l.createdAt) + '</dd>'
      + (l.wonAt ? '<dt>Ngày chốt</dt><dd>' + ngay(l.wonAt) + '</dd>' : '')
      + (l.lostAt ? '<dt>Ngày đóng</dt><dd>' + ngay(l.lostAt) + ' · ' + esc(l.lostReason||'—') + '</dd>' : '')
      + '</dl>';

    [['Lịch trình', l.schedule], ['Chân dung khách hàng', l.persona], ['Objection của khách', l.objection]]
      .forEach(function(x){
        if (x[1] && String(x[1]).trim())
          h += '<div class="blk"><div class="blk-title">'+x[0]+'</div><div class="note"><div class="note-text">'
             + linkify(esc(x[1])) + '</div></div></div>';
      });

    h += '<div class="blk"><div class="blk-title">Việc cần làm ('+l.soViecXong+'/'+l.soViec+')</div>';
    h += l.todos.length ? l.todos.map(function(t){
      return '<div class="todo"><span class="tick'+(t.done?' on':'')+'">'+(t.done?'✓':'')+'</span>'
        + '<span class="txt'+(t.done?' done':'')+'">'+esc(t.text)+'</span>'
        + '<span class="chip gray">'+esc(t.status)+'</span></div>';
    }).join('') : '<div class="empty">Chưa có việc nào.</div>';
    h += '</div>';

    h += '<div class="blk"><div class="blk-title">Ghi chú ('+l.notesList.length+')</div>';
    h += l.notesList.length ? l.notesList.slice().reverse().map(function(n){
      return '<div class="note"><div class="note-time">'+esc(n.updatedAt||n.createdAt||'')+'</div>'
        + '<div class="note-text">'+linkify(esc(n.text))+'</div></div>';
    }).join('') : '<div class="empty">Chưa có ghi chú nào.</div>';
    h += '</div>';

    h += '<div class="blk"><div class="blk-title">Lịch sử hoạt động</div>';
    h += l.activityLog.length ? l.activityLog.slice().reverse().slice(0, 40).map(function(a){
      return '<div class="log"><div class="log-t">'+esc(a.time||'')+'</div>'+esc(a.text||'')+'</div>';
    }).join('') : '<div class="empty">Chưa có hoạt động nào.</div>';
    h += '</div>';

    // 'todoXong' khong nam trong bang DS nhung van la mot danh sach quay lai duoc
    var quayLaiDuoc = tuDau && (DS[tuDau] || tuDau === 'todoXong') ? tuDau : null;
    moModal(l.name, l.stageName + ' · ' + esc(l.leadType), h, quayLaiDuoc);
  }

  /* ---------- Điều hướng ---------- */
  // Giữ nguyên mọi lựa chọn hiện tại, chỉ thay phần được truyền vào.
  function ky(thayDoi){
    var g = { don: duLieu.don, lui: duLieu.lui, leadType: duLieu.loaiLead || '' };
    if (duLieu.don === 'tuyChon'){ g.tu = duLieu.tu; g.den = duLieu.den; }
    for (var k in thayDoi) g[k] = thayDoi[k];
    taiLai(g);
  }
  function luiKy(buoc){ ky({ lui: Math.max(0, duLieu.lui + buoc) }); }
  function veHienTai(){ ky({ lui: 0 }); }
  function doiLoai(v){ ky({ leadType: v }); }
  function doiDon(v){
    // Đổi đơn vị thì về kỳ hiện tại, vì "lùi 3 kỳ" của tuần và của năm khác nhau xa
    if (v === 'tuyChon'){
      ky({ don:'tuyChon', lui:0, tu: duLieu.tu, den: duLieu.den });
    } else {
      ky({ don: v, lui: 0 });
    }
  }
  function xemKhoang(){
    var a = document.getElementById('tuNgay').value;
    var b = document.getElementById('denNgay').value;
    if (!a || !b){ alert('Chọn đủ ngày bắt đầu và ngày kết thúc nhé.'); return; }
    ky({ don:'tuyChon', lui:0, tu:a, den:b });
  }

  window.XEM = { moLead:moLead, moDs:moDs, moPheu:moPheu, dong:dong,
                 luiKy:luiKy, veHienTai:veHienTai, doiDon:doiDon,
                 xemKhoang:xemKhoang, doiLoai:doiLoai };
})();
</script>
</body>
</html>
